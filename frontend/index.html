<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mizon CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Geist:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
/* ===== MIZON CRM — DESIGN SYSTEM v2 ===== */
:root, [data-theme="dark"] {
  --bg-base: #100F0F;
  --bg-surface: #1A1919;
  --bg-hover: #242323;
  --surface-container-low: #1c1b1b;
  --surface-container: #211f1f;
  --surface-container-high: #2b2a29;
  --surface-variant: #363434;
  --primary: #5adf81;
  --primary-container: #01a750;
  --primary-invert: #003917;
  --accent: #5adf81;
  --text-main: #e6e1e1;
  --text-secondary: #bccaba;
  --text-muted: #879486;
  --border-light: #2A2A2A;
  --border-hover: #3d4a3e;
  --outline-variant: #2e2d2d;
  --danger: #ffb4ab;
  --danger-bg: #93000a;
  --warning: #f59e0b;
  --warning-bg: #92400e;
  --success: #5adf81;
  --success-bg: rgba(90,223,129,0.08);
  --font-body: 'Inter', sans-serif;
  --font-label: 'Geist', 'Inter', sans-serif;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --brand-color: #5adf81;
  --login-overlay-bg: rgba(8,8,8,0.94);
  --chat-bg: #100F0F;
  --card-shadow: 0 1px 6px rgba(0,0,0,0.4);
}
[data-theme="light"] {
  --bg-base: #f5f7f5;
  --bg-surface: #ffffff;
  --bg-hover: #eef2ee;
  --surface-container-low: #f1f5f1;
  --surface-container: #ffffff;
  --surface-container-high: #e8efe8;
  --surface-variant: #dde5dd;
  --primary: #01a750;
  --primary-container: #01a750;
  --primary-invert: #ffffff;
  --accent: #01a750;
  --text-main: #131613;
  --text-secondary: #3f4a3f;
  --text-muted: #6b7a6b;
  --border-light: #d8e0d8;
  --border-hover: #aebdae;
  --outline-variant: #d0d8d0;
  --danger: #b3261e;
  --danger-bg: #ffe7e3;
  --warning: #b35a00;
  --warning-bg: #fff1d6;
  --success: #01a750;
  --success-bg: rgba(1,167,80,0.1);
  --brand-color: #01a750;
  --login-overlay-bg: rgba(230,240,230,0.95);
  --chat-bg: #f1f5f1;
  --card-shadow: 0 1px 6px rgba(0,0,0,0.07);
}

*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg-base);color:var(--text-main);font-family:var(--font-body);font-size:14px;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface-variant);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--border-hover);}

.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 20;user-select:none;display:inline-block;vertical-align:middle;flex-shrink:0;line-height:1;}

/* ===== LAYOUT ===== */
.app-container{display:flex;height:100vh;overflow:hidden;}

/* ===== SIDEBAR ===== */
.sidebar{width:256px;min-width:256px;background:var(--bg-surface);border-right:1px solid var(--outline-variant);display:flex;flex-direction:column;z-index:10;}
.sidebar-brand{padding:18px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-light);}
.brand-icon{width:30px;height:30px;background:var(--primary-container);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;font-family:var(--font-label);flex-shrink:0;}
.brand-name{font-size:16px;font-weight:800;color:var(--text-main);letter-spacing:-0.4px;font-family:var(--font-label);}
.brand-role{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--primary);background:var(--success-bg);padding:2px 7px;border-radius:20px;border:1px solid rgba(90,223,129,0.2);margin-left:auto;flex-shrink:0;}

.sidebar-nav{flex:1;padding:8px 8px;overflow-y:auto;}
.nav-section-label{font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);font-weight:700;padding:10px 12px 4px;font-family:var(--font-label);}

.nav-item{padding:9px 12px;border-radius:var(--radius-md);color:var(--text-secondary);cursor:pointer;margin-bottom:2px;font-weight:500;font-size:13px;display:flex;align-items:center;gap:10px;transition:background 0.15s,color 0.15s;font-family:var(--font-label);border-left:3px solid transparent;}
.nav-item:hover{background:var(--surface-variant);color:var(--text-main);}
.nav-item.active{background:rgba(90,223,129,0.07);color:var(--primary);border-left-color:var(--primary);font-weight:600;}
.nav-item-badge{font-size:9px;background:var(--danger-bg);color:var(--danger);padding:1px 5px;border-radius:4px;font-weight:700;text-transform:uppercase;margin-left:auto;}

.sidebar-footer{padding:10px 8px;border-top:1px solid var(--border-light);}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-md);}
.sidebar-user-name{font-size:13px;font-weight:600;color:var(--text-main);}
.sidebar-user-role{font-size:11px;color:var(--text-muted);}

/* ===== AVATAR ===== */
.avatar{border-radius:50%;background:linear-gradient(135deg,var(--primary-container),#006b33);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;font-family:var(--font-label);text-transform:uppercase;}

/* ===== MAIN ===== */
.main-wrapper{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg-base);}

/* ===== TOPBAR ===== */
.topbar{height:58px;border-bottom:1px solid var(--outline-variant);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--bg-surface);z-index:20;gap:16px;flex-shrink:0;}
.topbar-title{font-size:15px;font-weight:600;color:var(--text-main);letter-spacing:-0.3px;white-space:nowrap;}
.topbar-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.topbar-search{position:relative;}
.topbar-search input{background:var(--bg-base);border:1px solid var(--outline-variant);padding:7px 12px 7px 34px;border-radius:var(--radius-md);color:var(--text-main);width:230px;font-size:13px;outline:none;font-family:var(--font-body);transition:border-color 0.2s,box-shadow 0.2s;}
.topbar-search input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(90,223,129,0.12);}
.topbar-search input::placeholder{color:var(--text-muted);}
.topbar-search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;font-size:17px;}
.icon-btn{width:34px;height:34px;border-radius:var(--radius-md);background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:background 0.15s,color 0.15s;}
.icon-btn:hover{background:var(--surface-variant);color:var(--text-main);}
.icon-btn.theme-btn:hover{color:var(--primary);}

/* ===== CONTENT ===== */
.content-area{flex:1;overflow-y:auto;padding:24px 28px 32px;}

/* ===== CARDS ===== */
.card{background:var(--bg-surface);border:1px solid var(--outline-variant);border-radius:var(--radius-lg);padding:20px;position:relative;overflow:hidden;}
.card.clickable{cursor:pointer;transition:border-color 0.2s,transform 0.15s,box-shadow 0.2s;}
.card.clickable:hover{border-color:var(--border-hover);transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,0.22);}
.card-title{color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;margin-bottom:8px;font-family:var(--font-label);}
.card-value{font-size:28px;font-weight:700;color:var(--text-main);letter-spacing:-0.03em;line-height:1.1;}

/* ===== PIPELINE / KANBAN ===== */
.pipeline-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
.pipeline-selector{background:var(--bg-surface);border:1px solid var(--outline-variant);padding:7px 12px;color:var(--text-main);border-radius:var(--radius-md);outline:none;font-size:13px;cursor:pointer;font-family:var(--font-label);transition:border-color 0.2s;}
.pipeline-selector:hover{border-color:var(--border-hover);}
.kanban-board{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;flex:1;min-height:0;}
.kanban-col{min-width:280px;max-width:280px;display:flex;flex-direction:column;}
.kanban-col-header{display:flex;justify-content:space-between;align-items:center;padding:0 2px 10px;border-bottom:2px solid var(--border-light);margin-bottom:10px;}
.kanban-col-title{font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.07em;font-family:var(--font-label);display:flex;align-items:center;gap:7px;}
.col-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.kanban-col-count{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--surface-variant);color:var(--text-muted);font-family:var(--font-label);}
.kanban-cards{display:flex;flex-direction:column;gap:9px;overflow-y:auto;padding:2px;flex:1;min-height:180px;}

.k-card{background:var(--bg-surface);border:1px solid var(--border-light);padding:12px 14px;border-radius:var(--radius-md);cursor:grab;transition:border-color 0.2s,box-shadow 0.2s,transform 0.12s;box-shadow:var(--card-shadow);border-left:3px solid var(--primary-container);}
.k-card:hover{border-color:var(--border-hover);transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,0.28);}
.k-card:active{cursor:grabbing;transform:scale(0.99);}
.k-card.status-danger{background:rgba(147,0,10,0.28);border-color:rgba(255,180,171,0.5);border-left-color:var(--danger);}
.k-card.status-warning{background:rgba(146,64,14,0.22);border-color:rgba(245,158,11,0.5);border-left-color:var(--warning);}

@keyframes pulseRedBorder{0%{box-shadow:0 0 0 0 rgba(255,180,171,0.5);}70%{box-shadow:0 0 0 6px rgba(255,180,171,0);}100%{box-shadow:0 0 0 0 rgba(255,180,171,0);}}
.k-card.needs-attention{animation:pulseRedBorder 2s infinite;border-color:rgba(255,180,171,0.5);border-left-color:var(--danger);}

.source-badge{padding:2px 7px;font-size:10px;border-radius:4px;color:#fff;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;font-family:var(--font-label);display:inline-block;}
.badge-meta_fb_ads{background:#1877F2;}
.badge-telegram_bot,.badge-telegram_ch{background:#0088cc;}
.badge-phone_call{background:var(--primary-container);}
.badge-referral{background:#9333EA;}
.badge-manual{background:var(--surface-variant);color:var(--text-secondary)!important;}
.badge-website{background:#ea580c;}

/* ===== LEAD PANEL ===== */
.lead-panel-overlay{position:fixed;inset:0;width:100%;height:100vh;background:var(--bg-base);z-index:100;display:flex;flex-direction:column;animation:slideInPanel 0.2s ease;}
@keyframes slideInPanel{from{opacity:0;transform:scale(0.99)}to{opacity:1;transform:scale(1)}}
.lead-panel-header{padding:14px 28px;border-bottom:1px solid var(--outline-variant);display:flex;justify-content:space-between;align-items:center;background:var(--bg-surface);flex-shrink:0;}
.lead-panel-body{flex:1;display:grid;grid-template-columns:420px 1fr;overflow:hidden;min-height:0;}
.lead-profile-col{border-right:1px solid var(--outline-variant);padding:18px 20px;overflow-y:auto;background:var(--bg-surface);}
.lead-chat-col{display:flex;flex-direction:column;overflow:hidden;background:var(--chat-bg);}

.info-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-light);font-size:13px;}
.info-row:last-child{border-bottom:none;}
.info-row-icon{width:28px;height:28px;border-radius:7px;background:var(--surface-variant);display:flex;align-items:center;justify-content:center;color:var(--text-muted);flex-shrink:0;}
.info-label{color:var(--text-muted);font-size:11px;min-width:60px;flex-shrink:0;}
.info-value{color:var(--text-main);font-weight:500;flex:1;text-align:right;font-size:13px;}

/* ===== CHAT ===== */
.chat-logs-area{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:18px;}
.chat-input-area{border-top:1px solid var(--outline-variant);padding:12px 16px;background:var(--bg-surface);display:flex;gap:8px;flex-shrink:0;}
.sys-log{text-align:center;font-size:11px;color:var(--text-muted);background:var(--surface-variant);padding:3px 12px;border-radius:20px;align-self:center;font-weight:500;max-width:90%;}
.msg-bubble{max-width:80%;padding:9px 13px;border-radius:var(--radius-md);font-size:13px;line-height:1.5;}
.msg-in{background:var(--bg-surface);border:1px solid var(--outline-variant);align-self:flex-start;}
.msg-out{background:rgba(1,167,80,0.12);border:1px solid rgba(1,167,80,0.22);align-self:flex-end;color:var(--text-main);}

.lead-pinned-task{background:rgba(245,158,11,0.09);border-bottom:1px solid rgba(245,158,11,0.28);padding:10px 20px;font-size:12px;color:var(--warning);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.operator-bar{padding:7px 18px;background:rgba(59,130,246,0.05);border-bottom:1px solid rgba(59,130,246,0.15);display:flex;align-items:center;gap:8px;font-size:12px;flex-shrink:0;}
.online-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 5px #22c55e;flex-shrink:0;}

/* ===== MODALS ===== */
.login-overlay{position:fixed;inset:0;background:var(--login-overlay-bg);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(12px);}
.login-box{width:400px;padding:40px;background:var(--bg-surface);border:1px solid var(--outline-variant);border-radius:16px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,0.6);}
.large-modal-box{width:880px;max-width:92%;max-height:86vh;padding:28px;background:var(--bg-surface);border:1px solid var(--outline-variant);border-radius:var(--radius-lg);overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,0.6);}

/* ===== TABLES ===== */
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--outline-variant);}
th{color:var(--text-muted);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:0.1em;font-family:var(--font-label);background:var(--surface-container-low);}
tr:hover td{background:var(--surface-variant);}

/* ===== BUTTONS ===== */
.btn-primary{background:var(--primary-container);color:#fff;border:none;padding:8px 16px;border-radius:var(--radius-md);font-weight:600;cursor:pointer;font-size:12px;letter-spacing:0.04em;font-family:var(--font-label);display:inline-flex;align-items:center;gap:6px;box-shadow:0 0 12px rgba(1,167,80,0.2);transition:filter 0.15s,box-shadow 0.15s,transform 0.1s;}
.btn-primary:hover{filter:brightness(1.1);box-shadow:0 0 20px rgba(1,167,80,0.35);}
.btn-primary:active{transform:scale(0.98);}
.btn-outline{background:transparent;color:var(--text-secondary);border:1px solid var(--border-light);padding:8px 16px;border-radius:var(--radius-md);font-weight:500;cursor:pointer;font-size:12px;letter-spacing:0.04em;font-family:var(--font-label);display:inline-flex;align-items:center;gap:6px;transition:background 0.15s,border-color 0.15s,color 0.15s,transform 0.1s;}
.btn-outline:hover{background:var(--bg-hover);border-color:var(--border-hover);color:var(--text-main);}
.btn-outline:active{transform:scale(0.98);}
.btn-success{background:var(--primary-container);color:#fff;border:none;padding:8px 16px;border-radius:var(--radius-md);font-weight:600;cursor:pointer;font-size:12px;letter-spacing:0.04em;font-family:var(--font-label);display:inline-flex;align-items:center;gap:6px;transition:filter 0.15s,transform 0.1s;}
.btn-success:hover{filter:brightness(1.1);}
.btn-success:active{transform:scale(0.98);}
.btn-danger{background:rgba(255,180,171,0.07);color:var(--danger);border:1px solid rgba(255,180,171,0.28);padding:8px 16px;border-radius:var(--radius-md);font-weight:500;cursor:pointer;font-size:12px;letter-spacing:0.04em;font-family:var(--font-label);display:inline-flex;align-items:center;gap:6px;transition:background 0.15s,transform 0.1s;}
.btn-danger:hover{background:rgba(255,180,171,0.15);}
.btn-danger:active{transform:scale(0.98);}

/* ===== INPUTS ===== */
.input-base{width:100%;background:var(--bg-base);border:1px solid var(--outline-variant);padding:9px 12px;border-radius:var(--radius-md);color:var(--text-main);font-size:13px;outline:none;margin-bottom:10px;font-family:var(--font-body);transition:border-color 0.2s,box-shadow 0.2s;}
.input-base:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(90,223,129,0.14);}
.input-base::placeholder{color:var(--text-muted);}
.label-sm{font-size:11px;color:var(--text-muted);margin-bottom:5px;display:block;text-transform:uppercase;font-weight:600;letter-spacing:0.08em;font-family:var(--font-label);}

/* ===== SETTINGS ===== */
.settings-tab-bar{display:flex;gap:4px;background:var(--bg-surface);border:1px solid var(--outline-variant);padding:5px;border-radius:var(--radius-md);margin-bottom:20px;}
.settings-tab{flex:1;text-align:center;padding:9px 8px;font-size:12px;font-weight:500;color:var(--text-secondary);cursor:pointer;border-radius:var(--radius-sm);transition:background 0.15s,color 0.15s;font-family:var(--font-label);display:flex;align-items:center;justify-content:center;gap:6px;}
.settings-tab:hover{background:var(--surface-variant);color:var(--text-main);}
.settings-tab.active{background:var(--surface-container-high);color:var(--primary);font-weight:700;}

/* ===== CHART BARS ===== */
.chart-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.chart-bar-label{font-size:11px;color:var(--text-muted);width:100px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chart-bar-track{flex:1;height:5px;background:var(--surface-variant);border-radius:3px;overflow:hidden;}
.chart-bar-fill{height:100%;border-radius:3px;transition:width 0.5s ease;}
.chart-bar-val{font-size:11px;font-weight:600;color:var(--text-secondary);width:20px;text-align:right;flex-shrink:0;}

/* ===== THEME TRANSITIONS ===== */
.sidebar,.main-wrapper,.topbar,.card,.k-card,.input-base,.btn-primary,.btn-outline,.login-box,.large-modal-box,.lead-panel-overlay{transition:background-color 0.3s,border-color 0.3s,color 0.3s;}

/* ===== PAYMENT BADGES ===== */
.pay-badge{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;font-family:var(--font-label);}
.pay-paid{background:rgba(1,167,80,0.12);color:#01a750;border:1px solid rgba(1,167,80,0.3);}
.pay-pending{background:rgba(245,158,11,0.12);color:#f59e0b;border:1px solid rgba(245,158,11,0.3);}
.pay-debt{background:rgba(239,68,68,0.12);color:#ef4444;border:1px solid rgba(239,68,68,0.3);}

/* ===== STAT MINI CARDS ===== */
.stat-mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.stat-mini{background:var(--bg-surface);border:1px solid var(--outline-variant);border-radius:var(--radius-lg);padding:16px 18px;}
.stat-mini.clickable{cursor:pointer;transition:border-color 0.15s,background 0.15s,transform 0.1s;}
.stat-mini.clickable:hover{border-color:var(--border-hover);background:var(--bg-hover);transform:translateY(-1px);}
.stat-mini-label{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);font-weight:600;margin-bottom:6px;font-family:var(--font-label);}
.stat-mini-value{font-size:26px;font-weight:700;letter-spacing:-0.03em;}

/* ===== FILTER ROW ===== */
.filter-row{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}

/* ===== MODULE HEADER ===== */
.mod-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;}
.mod-title{font-size:21px;font-weight:700;letter-spacing:-0.5px;}
.mod-sub{font-size:12px;color:var(--text-muted);margin-top:4px;}

/* ===== FB ADS PROGRESS ===== */
.budget-bar{height:4px;background:var(--surface-variant);border-radius:2px;overflow:hidden;margin-top:3px;}
.budget-bar-fill{height:100%;border-radius:2px;background:#1877F2;}
  </style>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // ===== ICON COMPONENT (Material Symbols Outlined) =====
    const Ico = ({ n, s = 16, c = {} }) => {

              <input className="input-base" placeholder="Login (username)" value={form.username} onChange={e=>setForm({...form,username:e.target.value})} />
              <input className="input-base" placeholder="Maxfiy parol" type="password" value={form.password} onChange={e=>setForm({...form,password:e.target.value})} />
              <select className="input-base" value={form.role} onChange={e=>setForm({...form,role:e.target.value})}>
                <option value="MANAGER">MANAGER (Sotuvchi)</option>
                <option value="CEO">CEO (Boshqaruvchi)</option>
              </select>
              <div style={{display:'flex', gap:'8px'}}>
                <button className="btn-primary" onClick={saveNewUser} disabled={saving}>{saving?'Saqlanmoqda...':'Qo\'shish'}</button>
                <button className="btn-outline" onClick={()=>setIsAdding(false)}>Bekor qilish</button>
              </div>
            </div>
          ) : (
            <button className="btn-outline" style={{marginTop:'14px'}} onClick={()=>{setForm({username:'',password:'',role:'MANAGER'});setIsAdding(true);}}>+ Yangi xodim qo'shish</button>
          )}
        </div>
      );
    };

    // ===== GLOBAL LIMITS =====
    const GlobalLimitsConfig = ({ globalCallLimit, setGlobalCallLimit }) => {
      const [tlimit, setTlimit] = useState(globalCallLimit);
      return (
        <div style={{padding:'20px', background:'var(--bg-hover)', border:'1px solid var(--border-light)', borderRadius:'8px'}}>
          <span className="label-sm">Avtomatik LOST Limit (Call Limit)</span>
          <p style={{fontSize:'12px', color:'var(--text-muted)', marginBottom:'16px'}}>
            Ushbu raqam mijoz bilan bog'lanish uchun berilgan maksimal urinishlar soni. Limit tugasa tizim mijozni LOST statusiga o'tkazadi.
          </p>
          <div style={{display:'flex', gap:'12px', alignItems:'center'}}>
            <input type="number" className="input-base" style={{marginBottom:0, width:'100px', fontSize:'18px'}} value={tlimit} onChange={e=>setTlimit(Number(e.target.value))} />
            <button className="btn-primary" onClick={()=>{setGlobalCallLimit(tlimit);alert("Global limit saqlandi!");}}>Tasdiqlash</button>
          </div>
        </div>
      );
    };

    // ===== INTEGRATIONS =====
    const IntegrationsModule = () => {
      const [apiKeys, setApiKeys] = useState([]);
      const [hooks, setHooks] = useState([]);
      const [newHookForm, setNewHookForm] = useState({name:'', token:''});
      const generateKey = () => setApiKeys([...apiKeys,{id:Date.now(), token:'mzk_'+Math.random().toString(36).substr(2,16)+'HQ8x'}]);
      const copySysKey = (key) => { navigator.clipboard.writeText(key); alert("API Kalit nusxalandi!"); };
      const deleteSysKey = (id) => setApiKeys(apiKeys.filter(k=>k.id!==id));
      const addHook = () => { if(!newHookForm.name||!newHookForm.token) return; setHooks([...hooks,{...newHookForm,id:Date.now()}]); setNewHookForm({name:'',token:''}); };
      return (
        <div style={{maxWidth:'780px', margin:'0 auto'}}>
          <div style={{display:'flex', alignItems:'center', gap:'12px', marginBottom:'24px'}}>
            <div style={{width:'40px', height:'40px', background:'rgba(1,167,80,0.12)', borderRadius:'10px', display:'flex', alignItems:'center', justifyContent:'center'}}>
              <Ico n="plug" s={20} c={{color:'var(--primary)'}}/>
            </div>
            <div>
              <h2 style={{fontSize:'18px', fontWeight:700}}>Tashqi Dasturlar va Integratsiyalar</h2>
              <p style={{fontSize:'12px', color:'var(--text-muted)'}}>API kalitlar, webhooklar va tashqi xizmatlar</p>
            </div>
          </div>

          <div className="card" style={{marginBottom:'16px'}}>
            <h3 style={{marginBottom:'12px', fontSize:'15px', fontWeight:600}}>Shaxsiy Mizon API Kalitlar</h3>
            <p style={{fontSize:'12px', color:'var(--text-muted)', marginBottom:'14px'}}>Tizimni saytingiz yoki 1C kabi dasturlar bilan integratsiya qilish uchun xavfsiz kalitlar yarating.</p>
            <button className="btn-primary" onClick={generateKey} style={{marginBottom:'12px'}}>+ Yangi API Kalit Yaratish</button>
            {apiKeys.length > 0 && (
              <div style={{display:'flex', flexDirection:'column', gap:'8px'}}>
                {apiKeys.map(k => (
                  <div key={k.id} style={{padding:'10px 14px', background:'var(--success-bg)', border:'1px solid rgba(90,223,129,0.25)', borderRadius:'8px', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                    <code style={{color:'var(--success)', fontSize:'12px'}}>{k.token}</code>
                    <div style={{display:'flex', gap:'8px'}}>
                      <button className="btn-success" style={{background:'rgba(16,185,129,0.15)', color:'var(--success)', border:'1px solid rgba(90,223,129,0.3)', padding:'5px 10px'}} onClick={()=>copySysKey(k.token)}>Nusxa</button>
                      <button className="btn-danger" style={{padding:'5px 10px'}} onClick={()=>deleteSysKey(k.id)}>O'chirish</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="card">
            <h3 style={{marginBottom:'12px', fontSize:'15px', fontWeight:600}}>Webhook va Tashqi Manbalar</h3>
            <div style={{padding:'14px', background:'var(--bg-hover)', border:'1px solid var(--border-light)', borderRadius:'8px', marginBottom:'14px'}}>
              <span className="label-sm">Xizmat nomi (Meta Ads, Telegram, va h.k.):</span>
              <input className="input-base" value={newHookForm.name} onChange={e=>setNewHookForm({...newHookForm,name:e.target.value})} />
              <span className="label-sm">API Token / Webhook URL:</span>
              <input className="input-base" value={newHookForm.token} onChange={e=>setNewHookForm({...newHookForm,token:e.target.value})} />
              <button className="btn-success" onClick={addHook}>Ulash</button>
            </div>
            {hooks.length > 0 && (
              <div style={{display:'flex', flexDirection:'column', gap:'8px'}}>
                {hooks.map(h => (
                  <div key={h.id} style={{padding:'10px 14px', background:'var(--bg-base)', border:'1px solid var(--border-light)', borderRadius:'8px', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                    <div>
                      <div style={{fontWeight:600, fontSize:'13px'}}>{h.name}</div>
                      <div style={{fontSize:'11px', color:'var(--text-muted)', marginTop:'2px'}}>{h.token}</div>
                    </div>
                    <button className="btn-outline" style={{padding:'5px 10px'}} onClick={()=>setHooks(hooks.filter(x=>x.id!==h.id))}>Uzish</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    };

    // ===== CALL CENTER MODULE (fully functional) =====
    const CallCenterModule = ({ leads, setLeads, globalCallLimit, setSelectedLeadId }) => {
      const [filterOp, setFilterOp] = useState('all');
      const [filterSt, setFilterSt] = useState('all');
      const [showAdd, setShowAdd] = useState(false);
      const [selLead, setSelLead] = useState('');
      const [callNote, setCallNote] = useState('');
      const [drillDown, setDrillDown] = useState(null);

      const allCalls = [];
      leads.forEach(lead => {
        lead.chatLogs.forEach(log => {
          if(log.text && (log.text.includes("Qo'ng'iroq") || log.text.includes('📞') || log.text.includes('⛔'))) {
            allCalls.push({
              leadId: String(lead.id), leadName: lead.name, phone: lead.phone,
              operator: lead.owner, date: log.date, note: log.text,
              status: log.text.includes('⛔') ? 'missed' : 'answered'
            });
          }
        });
      });
      allCalls.sort((a, b) => new Date(b.date) - new Date(a.date));

      const filtered = allCalls.filter(c => {
        if(filterOp !== 'all' && c.operator !== filterOp) return false;
        if(filterSt !== 'all' && c.status !== filterSt) return false;
        return true;
      });

      const totalAttempts = leads.reduce((s, l) => s + (l.actualCallAttempts || 0), 0);
      const answered = allCalls.filter(c => c.status === 'answered').length;
      const missed = allCalls.filter(c => c.status === 'missed').length;
      const activeLeadsCount = leads.filter(l => l.actualCallAttempts > 0).length;
      const operatorNames = [...new Set(leads.map(l => l.owner))];

      // Drill-down items for "Faol mijozlar" card
      const activeCallLeads = leads.filter(l => l.actualCallAttempts > 0).map(l => {
        const lastCallLog = [...l.chatLogs].reverse().find(lg => lg.text && (lg.text.includes('📞') || lg.text.includes('⛔')));
        return {
          leadId: String(l.id), leadName: l.name, phone: l.phone, operator: l.owner,
          date: lastCallLog?.date || l.chatLogs[0]?.date || '',
          note: `${l.actualCallAttempts} ta urinish · ${l.status}`,
          status: l.status === 'LOST' ? 'missed' : 'answered'
        };
      });

      const logCall = () => {
        if(!selLead) return alert("Mijozni tanlang!");
        const lead = leads.find(l => String(l.id) === selLead);
        if(!lead) return;
        const attempts = (lead.actualCallAttempts || 0) + 1;
        const isLost = attempts >= globalCallLimit;
        const logText = isLost
          ? `⛔ Call Center dan chaqirildi. Limit tugadi (${globalCallLimit} urinish). → LOST`
          : `📞 Call Center: Qo'ng'iroq #${attempts} / Limit ${globalCallLimit}${callNote ? ' — ' + callNote : ''}`;
        const updatedLead = {
          ...lead, actualCallAttempts: attempts,
          status: isLost ? 'LOST' : lead.status,
          chatLogs: [...lead.chatLogs, { type:'sys', date: new Date().toISOString(), text: logText }]
        };
        setLeads(prev => prev.map(l => String(l.id) === selLead ? updatedLead : l));
        setSelLead(''); setCallNote(''); setShowAdd(false);
      };

      return (
        <div>
          <div className="mod-header">
            <div>
              <div className="mod-title">Call Center</div>
              <div className="mod-sub">Qo'ng'iroqlar jurnali va real-time statistika</div>
            </div>
            <button className="btn-primary" onClick={() => setShowAdd(!showAdd)}>
              <span className="material-symbols-outlined" style={{fontSize:'16px',lineHeight:1,flexShrink:0}}>add_call</span> Qo'ng'iroq qayd etish
            </button>
          </div>

          {showAdd && (
            <div className="card" style={{marginBottom:'16px', background:'rgba(1,167,80,0.04)', border:'1px solid rgba(1,167,80,0.25)'}}>
              <div style={{fontWeight:600, fontSize:'14px', marginBottom:'14px', display:'flex', alignItems:'center', gap:'8px'}}>
                <span className="material-symbols-outlined" style={{fontSize:'18px', color:'var(--primary)'}}>call</span>
                Yangi qo'ng'iroqni qayd etish
              </div>
              <div style={{display:'grid', gridTemplateColumns:'1fr 1fr auto', gap:'10px', alignItems:'end'}}>
                <div>
                  <span className="label-sm">Mijoz</span>
                  <select className="input-base" style={{marginBottom:0}} value={selLead} onChange={e=>setSelLead(e.target.value)}>
                    <option value="">— Mijozni tanlang —</option>
                    {leads.filter(l=>!['LOST','WON'].includes(l.status)).map(l => (
                      <option key={l.id} value={String(l.id)}>{l.name} ({l.phone}) · {l.actualCallAttempts}/{globalCallLimit}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <span className="label-sm">Izoh (ixtiyoriy)</span>
                  <input className="input-base" style={{marginBottom:0}} placeholder="Shartnoma haqida gaplashildi..." value={callNote} onChange={e=>setCallNote(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') logCall(); }} />
                </div>
                <div style={{display:'flex', gap:'8px', paddingBottom:'1px'}}>
                  <button className="btn-primary" onClick={logCall}>Qayd etish</button>
                  <button className="btn-outline" onClick={()=>setShowAdd(false)}>✕</button>
                </div>
              </div>
            </div>
          )}

          <div className="stat-mini-grid">
            {[
              {label:"Jami urinishlar", val:totalAttempts, color:'var(--text-main)',
                onClick: () => setDrillDown({ title:"Jami qo'ng'iroqlar ro'yxati", items: allCalls })},
              {label:"Javob berildi", val:answered, color:'#01a750',
                onClick: () => setDrillDown({ title:"Javob berilgan qo'ng'iroqlar", items: allCalls.filter(c => c.status === 'answered') })},
              {label:"O'tkazib yuborildi", val:missed, color:'#ef4444',
                onClick: () => setDrillDown({ title:"O'tkazib yuborilgan qo'ng'iroqlar", items: allCalls.filter(c => c.status === 'missed') })},
              {label:"Faol mijozlar", val:activeLeadsCount, color:'#3b82f6',
                onClick: () => setDrillDown({ title:"Qo'ng'iroq qilingan mijozlar", items: activeCallLeads })},
            ].map((m, i) => (
              <div key={i} className="stat-mini clickable" onClick={m.onClick} title="Ro'yxatni ko'rish uchun bosing">
                <div className="stat-mini-label">{m.label}</div>
                <div className="stat-mini-value" style={{color:m.color}}>{m.val}</div>
              </div>
            ))}
          </div>

          <div style={{display:'grid', gridTemplateColumns:'1fr 320px', gap:'14px', marginBottom:'14px'}}>
            <div className="card">
              <div style={{fontWeight:600, fontSize:'14px', marginBottom:'14px'}}>Operatorlar samaradorligi</div>
              {operatorNames.map(op => {
                const opLeads = leads.filter(l => l.owner === op);
                const opCalls = opLeads.reduce((s, l) => s + (l.actualCallAttempts||0), 0);
                const opWon = opLeads.filter(l => l.status==='WON').length;
                const opLost = opLeads.filter(l => l.status==='LOST').length;
                const maxCalls = Math.max(1, ...operatorNames.map(o => leads.filter(l=>l.owner===o).reduce((s,l)=>s+(l.actualCallAttempts||0),0)));
                return (
                  <div key={op} style={{padding:'12px', background:'var(--bg-base)', borderRadius:'8px', border:'1px solid var(--border-light)', marginBottom:'8px'}}>
                    <div style={{display:'flex', alignItems:'center', gap:'10px', marginBottom:'8px'}}>
                      <div className="avatar" style={{width:'32px', height:'32px', fontSize:'12px'}}>{op[0].toUpperCase()}</div>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:600, fontSize:'13px'}}>{op}</div>
                        <div style={{fontSize:'11px', color:'var(--text-muted)'}}>{opLeads.length} ta mijoz</div>
                      </div>
                      <div style={{display:'flex', gap:'10px', fontSize:'12px'}}>
                        <span style={{color:'#01a750', fontWeight:700}}>{opWon} ✓</span>
                        <span style={{color:'#ef4444', fontWeight:700}}>{opLost} ✗</span>
                        <span style={{color:'var(--text-muted)'}}>{opCalls} 📞</span>
                      </div>
                    </div>
                    <div className="chart-bar-track" style={{height:'5px'}}>
                      <div className="chart-bar-fill" style={{width:(opCalls/maxCalls*100)+'%', background:'var(--primary-container)'}}></div>
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="card" style={{display:'flex', flexDirection:'column', gap:'10px'}}>
              <div style={{fontWeight:600, fontSize:'14px'}}>VoIP Tizim</div>
              <div style={{flex:1, padding:'16px', background:'var(--bg-hover)', borderRadius:'10px', border:'1px solid var(--border-light)', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'10px', textAlign:'center'}}>
                <div style={{width:'56px', height:'56px', borderRadius:'50%', background:'rgba(1,167,80,0.1)', border:'2px solid rgba(1,167,80,0.4)', display:'flex', alignItems:'center', justifyContent:'center'}}>
                  <span className="material-symbols-outlined" style={{fontSize:'26px', color:'#01a750'}}>call</span>
                </div>
                <div>
                  <div style={{fontSize:'13px', fontWeight:700, color:'#01a750'}}>Moizvonki Faol</div>
                  <div style={{fontSize:'11px', color:'var(--text-muted)', marginTop:'4px'}}>VoIP tizim ulangan</div>
                </div>
                <code style={{fontSize:'10px', color:'var(--text-muted)', background:'var(--surface-variant)', padding:'4px 10px', borderRadius:'5px', display:'block', width:'100%'}}>POST /api/webhook/moizvonki</code>
              </div>
              <div style={{padding:'12px', background:'var(--bg-hover)', border:'1px solid var(--border-light)', borderRadius:'8px'}}>
                <div style={{fontSize:'10px', color:'var(--text-muted)', marginBottom:'8px', textTransform:'uppercase', fontWeight:700, letterSpacing:'0.06em'}}>Umumiy ko'rsatkichlar</div>
                {[
                  {label:"Jami qo'ng'iroqlar", val:totalAttempts},
                  {label:"Javob %", val: totalAttempts ? Math.round(answered/totalAttempts*100)+'%' : '0%'},
                  {label:"Konversiya", val: leads.length ? Math.round(leads.filter(l=>l.status==='WON').length/leads.length*100)+'%' : '0%'},
                ].map((s,i) => (
                  <div key={i} style={{display:'flex', justifyContent:'space-between', marginBottom:'5px'}}>
                    <span style={{fontSize:'12px', color:'var(--text-secondary)'}}>{s.label}</span>
                    <span style={{fontWeight:700, color:'var(--primary)'}}>{s.val}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="card" style={{padding:0, overflow:'hidden'}}>
            <div style={{padding:'14px 20px', borderBottom:'1px solid var(--outline-variant)', display:'flex', justifyContent:'space-between', alignItems:'center', gap:'12px', flexWrap:'wrap'}}>
              <span style={{fontWeight:600, fontSize:'14px'}}>Qo'ng'iroqlar jurnali ({filtered.length})</span>
              <div style={{display:'flex', gap:'8px'}}>
                <select className="pipeline-selector" style={{fontSize:'12px'}} value={filterOp} onChange={e=>setFilterOp(e.target.value)}>
                  <option value="all">Barcha operator</option>
                  {operatorNames.map(o => <option key={o} value={o}>{o}</option>)}
                </select>
                <select className="pipeline-selector" style={{fontSize:'12px'}} value={filterSt} onChange={e=>setFilterSt(e.target.value)}>
                  <option value="all">Barcha holat</option>
                  <option value="answered">Javob berildi</option>
                  <option value="missed">O'tkazildi</option>
                </select>
              </div>
            </div>
            <table>
              <thead><tr><th>Vaqt</th><th>Mijoz</th><th>Telefon</th><th>Operator</th><th>Holat</th><th>Izoh</th></tr></thead>
              <tbody>
                {filtered.length === 0 && (
                  <tr><td colSpan="6" style={{textAlign:'center', padding:'40px', color:'var(--text-muted)'}}>
                    {allCalls.length === 0 ? "Hozircha qo'ng'iroqlar mavjud emas. Yuqoridagi tugma orqali qo'ng'iroq qayd eting." : "Filtr bo'yicha natija topilmadi."}
                  </td></tr>
                )}
                {filtered.slice(0, 80).map((c, i) => (
                  <tr key={i}>
                    <td style={{fontSize:'11px', color:'var(--text-muted)', whiteSpace:'nowrap'}}>{new Date(c.date).toLocaleString()}</td>
                    <td style={{fontWeight:600}}>{c.leadName}</td>
                    <td style={{color:'var(--text-muted)', fontSize:'12px'}}>{c.phone}</td>
                    <td><span style={{background:'var(--surface-variant)', padding:'2px 8px', borderRadius:'10px', fontSize:'11px'}}>{c.operator}</span></td>
                    <td>
                      <span style={{padding:'3px 9px', borderRadius:'20px', fontSize:'10px', fontWeight:700, textTransform:'uppercase',
                        background: c.status==='answered'?'rgba(1,167,80,0.12)':'rgba(239,68,68,0.1)',
                        color: c.status==='answered'?'#01a750':'#ef4444',
                        border:`1px solid ${c.status==='answered'?'rgba(1,167,80,0.3)':'rgba(239,68,68,0.3)'}`}}>
                        {c.status==='answered' ? 'Javob' : "O'tkazildi"}
                      </span>
                    </td>
                    <td style={{fontSize:'11px', color:'var(--text-muted)', maxWidth:'220px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{c.note}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* ===== DRILL-DOWN MODAL ===== */}
          {drillDown && (
            <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.72)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'}}
              onClick={() => setDrillDown(null)}>
              <div style={{background:'var(--bg-surface)',borderRadius:'14px',width:'740px',maxWidth:'95vw',maxHeight:'82vh',display:'flex',flexDirection:'column',boxShadow:'0 12px 48px rgba(0,0,0,0.55)'}}
                onClick={e => e.stopPropagation()}>

                {/* Header */}
                <div style={{padding:'18px 22px',borderBottom:'1px solid var(--outline-variant)',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
                  <div style={{fontWeight:700,fontSize:'15px'}}>{drillDown.title}</div>
                  <button onClick={() => setDrillDown(null)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-muted)',fontSize:'22px',lineHeight:1,padding:'0 4px'}}>✕</button>
                </div>

                {/* Table */}
                <div style={{overflowY:'auto',flex:1}}>
                  <table style={{width:'100%',borderCollapse:'collapse'}}>
                    <thead>
                      <tr style={{background:'var(--bg-hover)',position:'sticky',top:0}}>
                        {['Vaqt','Mijoz','Telefon','Holat','Izoh'].map(h => (
                          <th key={h} style={{padding:'10px 16px',textAlign:'left',fontSize:'11px',color:'var(--text-muted)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',whiteSpace:'nowrap'}}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {drillDown.items.length === 0 && (
                        <tr><td colSpan="5" style={{textAlign:'center',padding:'40px',color:'var(--text-muted)',fontSize:'13px'}}>Ma'lumot topilmadi</td></tr>
                      )}
                      {drillDown.items.map((c, i) => (
                        <tr key={i}
                          style={{borderBottom:'1px solid var(--outline-variant)',cursor:'pointer',transition:'background 0.1s'}}
                          onClick={() => { setSelectedLeadId(c.leadId); setDrillDown(null); }}
                          onMouseEnter={e => e.currentTarget.style.background='var(--bg-hover)'}
                          onMouseLeave={e => e.currentTarget.style.background=''}>
                          <td style={{padding:'10px 16px',fontSize:'11px',color:'var(--text-muted)',whiteSpace:'nowrap'}}>{c.date ? new Date(c.date).toLocaleString() : '—'}</td>
                          <td style={{padding:'10px 16px',fontWeight:600,fontSize:'13px',color:'var(--primary)'}}>{c.leadName}</td>
                          <td style={{padding:'10px 16px',fontSize:'12px',color:'var(--text-muted)'}}>{c.phone}</td>
                          <td style={{padding:'10px 16px'}}>
                            <span style={{padding:'2px 9px',borderRadius:'20px',fontSize:'10px',fontWeight:700,textTransform:'uppercase',
                              background:c.status==='answered'?'rgba(1,167,80,0.12)':'rgba(239,68,68,0.1)',
                              color:c.status==='answered'?'#01a750':'#ef4444',
                              border:`1px solid ${c.status==='answered'?'rgba(1,167,80,0.3)':'rgba(239,68,68,0.3)'}`}}>
                              {c.status==='answered' ? 'Javob' : "O'tkazildi"}
                            </span>
                          </td>
                          <td style={{padding:'10px 16px',fontSize:'11px',color:'var(--text-muted)',maxWidth:'180px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.note}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

    // ===== HISOBOTLAR (REPORTS) MODULE (fully functional) =====
    const HisobotlarModule = ({ leads }) => {
      const [period, setPeriod] = useState('all');

      const filterByPeriod = (arr) => {
        if(period === 'all') return arr;
        const now = new Date();
        return arr.filter(l => {
          const d = new Date(l.chatLogs[0]?.date || 0);
          if(period === 'today') return d.toDateString() === now.toDateString();
          const days = period === 'week' ? 7 : 30;
          return (now - d) <= days * 86400000;
        });
      };
      const fl = filterByPeriod(leads);

      const sources = ['meta_fb_ads','telegram_bot','phone_call','referral','website','manual'];
      const sourceLabels = { meta_fb_ads:'Facebook Ads', telegram_bot:'Telegram', phone_call:'Telefon', referral:'Tavsiya', website:'Veb-sayt', manual:"Qo'lda" };
      const sourceColors = { meta_fb_ads:'#1877F2', telegram_bot:'#0088cc', phone_call:'#01a750', referral:'#9333EA', website:'#ea580c', manual:'#6b7280' };
      const stages = ['NEW','CONTACTED','QUALIFIED','PROPOSAL','NEGOTIATION','WON','LOST'];
      const stageLabels = { NEW:'Yangi', CONTACTED:'Aloqa', QUALIFIED:'Ehtiyoj', PROPOSAL:'Taklif', NEGOTIATION:'Muzokara', WON:'Yutildi', LOST:"Yo'qotildi" };

      const maxSource = Math.max(1, ...sources.map(s => fl.filter(l=>l.source===s).length));
      const maxStage  = Math.max(1, ...stages.map(s => fl.filter(l=>l.status===s).length));
      const won  = fl.filter(l=>l.status==='WON').length;
      const lost = fl.filter(l=>l.status==='LOST').length;
      const conversion = fl.length ? Math.round(won/fl.length*100) : 0;
      const totalCalls = fl.reduce((s,l)=>s+(l.actualCallAttempts||0),0);
      const allOwners = [...new Set(leads.map(l=>l.owner))];

      const exportCSV = () => {
        const headers = ['ID','Ism','Telefon','Manzil','Manba','Bosqich',"Mas'ul","Qo'ng'iroqlar"];
        const rows = fl.map(l => [l.id, l.name, l.phone, l.region, l.source, l.status, l.owner, l.actualCallAttempts]);
        const csv = [headers, ...rows].map(r => r.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
        const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `mizon_${period}_${new Date().toISOString().slice(0,10)}.csv`; a.click();
      };

      return (
        <div>
          <div className="mod-header">
            <div>
              <div className="mod-title">Hisobotlar</div>
              <div className="mod-sub">Tahlil, grafik va ma'lumotlarni eksport qilish</div>
            </div>
            <div style={{display:'flex', gap:'8px', alignItems:'center'}}>
              <select className="pipeline-selector" value={period} onChange={e=>setPeriod(e.target.value)}>
                <option value="all">Barcha vaqt</option>
                <option value="today">Bugun</option>
                <option value="week">So'nggi 7 kun</option>
                <option value="month">So'nggi 30 kun</option>
              </select>
              <button className="btn-primary" onClick={exportCSV}><Ico n="download" s={14}/> CSV Eksport</button>
            </div>
          </div>

          <div className="stat-mini-grid">
            {[
              {label:"Jami leadlar", val:fl.length, color:'var(--text-main)'},
              {label:"Konversiya", val:conversion+'%', color:'#01a750'},
              {label:"Yutilgan", val:won, color:'#01a750'},
              {label:"Yo'qotilgan", val:lost, color:'#ef4444'},
            ].map((m,i) => (
              <div key={i} className="stat-mini">
                <div className="stat-mini-label">{m.label}</div>
                <div className="stat-mini-value" style={{color:m.color}}>{m.val}</div>
              </div>
            ))}
          </div>

          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'14px', marginBottom:'14px'}}>
            <div className="card">
              <div className="card-title" style={{marginBottom:'14px'}}>Manba bo'yicha</div>
              {sources.map(s => {
                const cnt = fl.filter(l=>l.source===s).length;
                return (
                  <div key={s} className="chart-bar-row">
                    <span className="chart-bar-label">{sourceLabels[s]}</span>
                    <div className="chart-bar-track"><div className="chart-bar-fill" style={{width:(cnt/maxSource*100)+'%', background:sourceColors[s]}}></div></div>
                    <span className="chart-bar-val">{cnt}</span>
                  </div>
                );
              })}
            </div>
            <div className="card">
              <div className="card-title" style={{marginBottom:'14px'}}>Varonka bosqichlari</div>
              {stages.map(s => {
                const cnt = fl.filter(l=>l.status===s).length;
                return (
                  <div key={s} className="chart-bar-row">
                    <span className="chart-bar-label">{stageLabels[s]}</span>
                    <div className="chart-bar-track"><div className="chart-bar-fill" style={{width:(cnt/maxStage*100)+'%', background:colColors[s]||'var(--primary-container)'}}></div></div>
                    <span className="chart-bar-val">{cnt}</span>
                  </div>
                );
              })}
            </div>
          </div>

          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'14px', marginBottom:'14px'}}>
            <div className="card">
              <div className="card-title" style={{marginBottom:'14px'}}>Xodimlar samaradorligi</div>
              {allOwners.map(op => {
                const opL = fl.filter(l=>l.owner===op);
                const opWon = opL.filter(l=>l.status==='WON').length;
                const opCalls = opL.reduce((s,l)=>s+(l.actualCallAttempts||0),0);
                const maxOp = Math.max(1, ...allOwners.map(o => fl.filter(l=>l.owner===o).length));
                return (
                  <div key={op} style={{display:'flex', alignItems:'center', gap:'10px', padding:'10px', background:'var(--bg-base)', borderRadius:'8px', border:'1px solid var(--border-light)', marginBottom:'8px'}}>
                    <div className="avatar" style={{width:'32px', height:'32px', fontSize:'12px'}}>{op[0].toUpperCase()}</div>
                    <div style={{flex:1}}>
                      <div style={{display:'flex', justifyContent:'space-between', marginBottom:'4px'}}>
                        <span style={{fontWeight:600, fontSize:'13px'}}>{op}</span>
                        <span style={{fontSize:'11px', color:'var(--text-muted)'}}>{opL.length} lead · {opCalls} 📞</span>
                      </div>
                      <div className="chart-bar-track" style={{height:'5px'}}>
                        <div className="chart-bar-fill" style={{width:(opL.length/maxOp*100)+'%', background: opWon>0?'#01a750':'var(--primary-container)'}}></div>
                      </div>
                    </div>
                    <span style={{fontSize:'14px', fontWeight:700, color:'#01a750', minWidth:'20px', textAlign:'right'}}>{opWon}</span>
                  </div>
                );
              })}
            </div>
            <div className="card">
              <div className="card-title" style={{marginBottom:'14px'}}>Qo'shimcha ko'rsatkichlar</div>
              {[
                {label:"Jami qo'ng'iroqlar", val:totalCalls, icon:'call', color:'#3b82f6'},
                {label:"O'rtacha qo'ng'iroq / lead", val:fl.length?(totalCalls/fl.length).toFixed(1):'0', icon:'analytics', color:'#8b5cf6'},
                {label:"Kechikkan vazifalar", val:fl.filter(l=>l.deadline && new Date(l.deadline)<new Date()).length, icon:'timer_off', color:'#ef4444'},
                {label:"Vazifasiz faol leadlar", val:fl.filter(l=>!l.deadline&&!['NEW','WON','LOST'].includes(l.status)).length, icon:'warning', color:'#f59e0b'},
              ].map((item,i) => (
                <div key={i} style={{display:'flex', alignItems:'center', gap:'12px', padding:'10px', background:'var(--bg-base)', borderRadius:'8px', border:'1px solid var(--border-light)', marginBottom:'8px'}}>
                  <div style={{width:'32px', height:'32px', borderRadius:'8px', background:`${item.color}18`, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0}}>
                    <span className="material-symbols-outlined" style={{fontSize:'17px', color:item.color}}>{item.icon}</span>
                  </div>
                  <div style={{flex:1, fontSize:'12px', color:'var(--text-secondary)'}}>{item.label}</div>
                  <div style={{fontWeight:700, fontSize:'16px', color:item.color}}>{item.val}</div>
                </div>
              ))}
            </div>
          </div>

          <div className="card" style={{padding:0, overflow:'hidden'}}>
            <div style={{padding:'14px 20px', borderBottom:'1px solid var(--outline-variant)', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
              <span style={{fontWeight:600, fontSize:'14px'}}>To'liq lead hisoboti ({fl.length})</span>
              <button className="btn-outline" style={{padding:'6px 12px'}} onClick={exportCSV}><Ico n="download" s={13}/> Yuklab olish</button>
            </div>
            <table>
              <thead><tr><th>Ism</th><th>Telefon</th><th>Manba</th><th>Bosqich</th><th>Mas'ul</th><th>Qo'ng'iroq</th></tr></thead>
              <tbody>
                {fl.length === 0 && <tr><td colSpan="6" style={{textAlign:'center', padding:'30px', color:'var(--text-muted)'}}>Tanlangan davr uchun ma'lumot topilmadi</td></tr>}
                {fl.map(l => (
                  <tr key={l.id}>
                    <td style={{fontWeight:600}}>{l.name}</td>
                    <td style={{fontSize:'12px', color:'var(--text-muted)'}}>{l.phone}</td>
                    <td><span className={`source-badge badge-${l.source}`}>{l.source.replace('meta_','')}</span></td>
                    <td><span style={{fontSize:'11px', fontWeight:600, padding:'2px 9px', borderRadius:'4px', background:(colColors[l.status]||'#888')+'22', color:colColors[l.status]||'var(--text-muted)'}}>{l.status}</span></td>
                    <td>{l.owner}</td>
                    <td style={{fontWeight:600}}>{l.actualCallAttempts}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    // ===== MARKETING ANALYTICS MODULE (fully functional, localStorage) =====
    const MarketingModule = () => {
      const defaultCampaigns = [
        {id:'c1', name:"Asosiy savdo kampaniyasi", status:'active', budget:2500000, spent:1840000, leads:47, cpl:39100, reach:28400},
        {id:'c2', name:"Retargeting – Veb sayt", status:'active', budget:800000, spent:620000, leads:18, cpl:34400, reach:9200},
        {id:'c3', name:"Brand Awareness – Toshkent", status:'paused', budget:1200000, spent:1200000, leads:31, cpl:38700, reach:45600},
      ];
      const [campaigns, setCampaigns] = useState(() => {
        const s = localStorage.getItem('mizon_campaigns');
        return s ? JSON.parse(s) : defaultCampaigns;
      });
      const tgChannels = [
        {id:'t1', name:'@mizon_uz', subscribers:12480, posts:42, reach:38200, clicks:1840, joinRate:'+240 bu oy'},
        {id:'t2', name:'@mizon_yangiliklar', subscribers:5320, posts:18, reach:14100, clicks:620, joinRate:'+89 bu oy'},
      ];
      const [showNew, setShowNew] = useState(false);
      const [editBudget, setEditBudget] = useState(null);
      const [newC, setNewC] = useState({name:'', budget:'', reach:''});

      useEffect(() => { localStorage.setItem('mizon_campaigns', JSON.stringify(campaigns)); }, [campaigns]);

      const toggleStatus = (id) => setCampaigns(prev => prev.map(c => c.id===id ? {...c, status:c.status==='active'?'paused':'active'} : c));
      const deleteCamp = (id) => { if(window.confirm("Kampaniyani o'chirishni tasdiqlaysizmi?")) setCampaigns(prev => prev.filter(c => c.id!==id)); };
      const saveBudget = () => {
        if(!editBudget) return;
        setCampaigns(prev => prev.map(c => c.id===editBudget.id ? {...c, budget:Number(editBudget.val)||c.budget} : c));
        setEditBudget(null);
      };
      const addCampaign = () => {
        if(!newC.name || !newC.budget) return alert("Kampaniya nomi va byudjetni kiriting!");
        setCampaigns(prev => [...prev, {id:'c_'+Date.now(), name:newC.name, status:'active', budget:Number(newC.budget), spent:0, leads:0, cpl:0, reach:Number(newC.reach)||0}]);
        setNewC({name:'', budget:'', reach:''}); setShowNew(false);
      };

      const fmt = n => n>=1000000?(n/1000000).toFixed(1)+'M':n>=1000?(n/1000).toFixed(0)+'K':String(n);
      const fmtSum = n => new Intl.NumberFormat('ru-RU').format(n)+" so'm";

      const totLeads = campaigns.reduce((s,c)=>s+c.leads,0);
      const totSpent = campaigns.reduce((s,c)=>s+c.spent,0);
      const avgCPL   = totLeads ? Math.round(totSpent/totLeads) : 0;
      const actCount = campaigns.filter(c=>c.status==='active').length;

      return (
        <div>
          <div className="mod-header">
            <div>
              <div className="mod-title">Marketing Analitika</div>
              <div className="mod-sub">Facebook Ads kampaniyalar va Telegram kanal boshqaruvi</div>
            </div>
            <button className="btn-primary" onClick={()=>setShowNew(!showNew)}><Ico n="plus" s={14}/> Yangi Kampaniya</button>
          </div>

          {showNew && (
            <div className="card" style={{marginBottom:'16px', background:'rgba(24,119,242,0.04)', border:'1px solid rgba(24,119,242,0.25)'}}>
              <div style={{fontWeight:600, fontSize:'14px', marginBottom:'14px', color:'#1877F2'}}>Yangi Facebook Kampaniya</div>
              <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr auto', gap:'10px', alignItems:'end'}}>
                <div>
                  <span className="label-sm">Kampaniya nomi</span>
                  <input className="input-base" style={{marginBottom:0}} placeholder="Yoz aksiyasi..." value={newC.name} onChange={e=>setNewC({...newC,name:e.target.value})} />
                </div>
                <div>
                  <span className="label-sm">Byudjet (so'm)</span>
                  <input type="number" className="input-base" style={{marginBottom:0}} placeholder="1000000" value={newC.budget} onChange={e=>setNewC({...newC,budget:e.target.value})} />
                </div>
                <div>
                  <span className="label-sm">Qamrov (taxmin)</span>
                  <input type="number" className="input-base" style={{marginBottom:0}} placeholder="10000" value={newC.reach} onChange={e=>setNewC({...newC,reach:e.target.value})} />
                </div>
                <div style={{display:'flex', gap:'8px', paddingBottom:'1px'}}>
                  <button className="btn-primary" onClick={addCampaign}>Qo'shish</button>
                  <button className="btn-outline" onClick={()=>setShowNew(false)}>✕</button>
                </div>
              </div>
            </div>
          )}

              {label:"Sarflandi", val:fmtSum(totSpent), color:'#f59e0b'},
              {label:"O'rtacha CPL", val:fmtSum(avgCPL), color:'#3b82f6'},

              <div key={i} className="stat-mini">

    // ===== APP =====
    const App = () => {
      const urlParams = new URLSearchParams(window.location.search);

      // ── URL params ───────────────────────────────────────────────

        { username: 'ceo',       password: '123', role: 'CEO' },
        { username: 'menejer_1', password: '123', role: 'MANAGER' }
      ]);
      const [authUser, setAuthUser] = useState(() => {
        try { const s = localStorage.getItem('mizon_session'); return s ? JSON.parse(s) : null; } catch(e) { return null; }

        localStorage.setItem('mizon_theme', darkMode ? 'dark' : 'light');
      }, [darkMode]);

      const [loginForm, setLoginForm]   = useState({username:'', password:''});
      const [loginLoading, setLoginLoading] = useState(false);
      const [loginError,   setLoginError]   = useState('');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [settingsActiveTab, setSettingsActiveTab] = useState('users');

      const [columnsMap, setColumnsMap] = useState(() => { const s = localStorage.getItem('mizon_columnsMap'); return s ? JSON.parse(s) : initialColumns; });
      const [leads, setLeads] = useState(() => {
        const s = localStorage.getItem('mizon_leads');
        if(s) { try { const p = JSON.parse(s); if(p.length > 0) return p; } catch(e) {} }
        return initialLeads;
      });

      const stageIdToFrontend = { 1:'NEW', 2:'CONTACTED', 3:'QUALIFIED', 4:'PROPOSAL', 5:'NEGOTIATION', 6:'WON', 7:'LOST' };
      const frontendToStageId = { 'NEW':1, 'CONTACTED':2, 'QUALIFIED':3, 'PROPOSAL':4, 'NEGOTIATION':5, 'WON':6, 'LOST':7, 'MEETING':2, 'CONTRACT':3 };

      // Fetch company info from slug (for branded login page)
      useEffect(() => {
        if (!companySlug) return;
        fetch(`/api/company/info?slug=${encodeURIComponent(companySlug)}`)
          .then(r => r.json()).then(d => { if (d.found) setCompanyInfo(d); })
          .catch(() => {});
      }, [companySlug]);

      // Helper: auth headers for all API calls
      const getAuthHeaders = () => {
        const t = localStorage.getItem('mizon_token');
        return { 'Content-Type':'application/json', ...(t ? { 'Authorization':'Bearer '+t } : {}) };
      };

      useEffect(() => {
        const headers = {};
        const t = localStorage.getItem('mizon_token');
        if (t) headers['Authorization'] = 'Bearer ' + t;
        fetch('/api/leads', { headers }).then(res => {
          if(!res.ok) throw new Error('API mavjud emas');
          return res.json();
        }).then(data => {
          if(data.success && data.leads && data.leads.length > 0) {
            setLeads(data.leads.map(l => ({
              id: l.id,
              pipelineId: l.pipelineid || 'p1',
              name: l.name,
              owner: l.owner || 'ceo',
              phone: l.phone,
              region: l.region || 'Toshkent',
              source: l.mizon_source || 'manual',
              status: stageIdToFrontend[l.stage_id] || 'NEW',
              actualCallAttempts: l.actualcallattempts || 0,
              deadline: l.deadline || null,
              taskDescription: l.taskdescription || null,
              chatLogs: typeof l.chatlogs === 'string' ? JSON.parse(l.chatlogs) : (l.chatlogs || [{type:'sys', date:l.created_at, text:"Tizimga qo'shildi"}])
            })));
          }
