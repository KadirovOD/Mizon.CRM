<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mizon CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Geist:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
/* ===== MIZON CRM — DESIGN SYSTEM v2 ===== */
:root, [data-theme="dark"] {
  --bg-base: #100F0F;
  --bg-surface: #1A1919;
  --bg-hover: #242323;
  --surface-container-low: #1c1b1b;
  --surface-container: #211f1f;
  --surface-container-high: #2b2a29;
  --surface-variant: #363434;
  --primary: #5adf81;
  --primary-container: #01a750;
  --primary-invert: #003917;
  --accent: #5adf81;
  --text-main: #e6e1e1;
  --text-secondary: #bccaba;
  --text-muted: #879486;
  --border-light: #2A2A2A;
  --border-hover: #3d4a3e;
  --outline-variant: #2e2d2d;
  --danger: #ffb4ab;
  --danger-bg: #93000a;
  --warning: #f59e0b;
  --warning-bg: #92400e;
  --success: #5adf81;
  --success-bg: rgba(90,223,129,0.08);
  --font-body: 'Inter', sans-serif;
  --font-label: 'Geist', 'Inter', sans-serif;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --brand-color: #5adf81;
  --login-overlay-bg: rgba(8,8,8,0.94);
  --chat-bg: #100F0F;
  --card-shadow: 0 1px 6px rgba(0,0,0,0.4);
}
[data-theme="light"] {
  --bg-base: #f5f7f5;
  --bg-surface: #ffffff;
  --bg-hover: #eef2ee;
  --surface-container-low: #f1f5f1;
  --surface-container: #ffffff;
  --surface-container-high: #e8efe8;
  --surface-variant: #dde5dd;
  --primary: #01a750;
  --primary-container: #01a750;
  --primary-invert: #ffffff;
  --accent: #01a750;
  --text-main: #131613;
  --text-secondary: #3f4a3f;
  --text-muted: #6b7a6b;
  --border-light: #d8e0d8;
  --border-hover: #aebdae;
  --outline-variant: #d0d8d0;
  --danger: #b3261e;
  --danger-bg: #ffe7e3;
  --warning: #b35a00;
  --warning-bg: #fff1d6;
  --success: #01a750;
  --success-bg: rgba(1,167,80,0.1);
  --brand-color: #01a750;
  --login-overlay-bg: rgba(230,240,230,0.95);
  --chat-bg: #f1f5f1;
  --card-shadow: 0 1px 6px rgba(0,0,0,0.07);
}

*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg-base);color:var(--text-main);font-family:var(--font-body);font-size:14px;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface-variant);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--border-hover);}

.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 20;user-select:none;display:inline-block;vertical-align:middle;flex-shrink:0;line-height:1;}

/* ===== LAYOUT ===== */
.app-container{display:flex;height:100vh;overflow:hidden;}

/* ===== SIDEBAR ===== */
.sidebar{width:256px;min-width:256px;background:var(--bg-surface);border-right:1px solid var(--outline-variant);display:flex;flex-direction:column;z-index:10;}
.sidebar-brand{padding:18px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-light);}
.brand-icon{width:30px;height:30px;background:var(--primary-container);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;font-family:var(--font-label);flex-shrink:0;}
.brand-name{font-size:16px;font-weight:800;color:var(--text-main);letter-spacing:-0.4px;font-family:var(--font-label);}
.brand-role{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--primary);background:var(--success-bg);padding:2px 7px;border-radius:20px;border:1px solid rgba(90,223,129,0.2);margin-left:auto;flex-shrink:0;}

.sidebar-nav{flex:1;padding:8px 8px;overflow-y:auto;}
.nav-section-label{font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);font-weight:700;padding:10px 12px 4px;font-family:var(--font-label);}

.nav-item{padding:9px 12px;border-radius:var(--radius-md);color:var(--text-secondary);cursor:pointer;margin-bottom:2px;font-weight:500;font-size:13px;display:flex;align-items:center;gap:10px;transition:background 0.15s,color 0.15s;font-family:var(--font-label);border-left:3px solid transparent;}
.nav-item:hover{background:var(--surface-variant);color:var(--text-main);}
.nav-item.active{background:rgba(90,223,129,0.07);color:var(--primary);border-left-color:var(--primary);font-weight:600;}
.nav-item-badge{font-size:9px;background:var(--danger-bg);color:var(--danger);padding:1px 5px;border-radius:4px;font-weight:700;text-transform:uppercase;margin-left:auto;}

.sidebar-footer{padding:10px 8px;border-top:1px solid var(--border-light);}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-md);}
.sidebar-user-name{font-size:13px;font-weight:600;color:var(--text-main);}
.sidebar-user-role{font-size:11px;color:var(--text-muted);}

/* ===== AVATAR ===== */
.avatar{border-radius:50%;background:linear-gradient(135deg,var(--primary-container),#006b33);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;font-family:var(--font-label);text-transform:uppercase;}

/* ===== MAIN ===== */
.main-wrapper{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg-base);}

/* ===== TOPBAR ===== */
.topbar{height:58px;border-bottom:1px solid var(--outline-variant);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--bg-surface);z-index:20;gap:16px;flex-shrink:0;}
.topbar-title{font-size:15px;font-weight:600;color:var(--text-main);letter-spacing:-0.3px;white-space:nowrap;}
.topbar-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.topbar-search{position:relative;}
.topbar-search input{background:var(--bg-base);border:1px solid var(--outline-variant);padding:7px 12px 7px 34px;border-radius:var(--radius-md);color:var(--text-main);width:230px;font-size:13px;outline:none;font-family:var(--font-body);transition:border-color 0.2s,box-shadow 0.2s;}
.topbar-search input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(90,223,129,0.12);}
.topbar-search input::placeholder{color:var(--text-muted);}
.topbar-search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;font-size:17px;}
.icon-btn{width:34px;height:34px;border-radius:var(--radius-md);background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:background 0.15s,color 0.15s;}
.icon-btn:hover{background:var(--surface-variant);color:var(--text-main);}
.icon-btn.theme-btn:hover{color:var(--primary);}

/* ===== CONTENT ===== */
.content-area{flex:1;overflow-y:auto;padding:24px 28px 32px;}

/* ===== CARDS ===== */
.card{background:var(--bg-surface);border:1px solid var(--outline-variant);border-radius:var(--radius-lg);padding:20px;position:relative;overflow:hidden;}
.card.clickable{cursor:pointer;transition:border-color 0.2s,transform 0.15s,box-shadow 0.2s;}
.card.clickable:hover{border-color:var(--border-hover);transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,0.22);}
.card-title{color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;margin-bottom:8px;font-family:var(--font-label);}
.card-value{font-size:28px;font-weight:700;color:var(--text-main);letter-spacing:-0.03em;line-height:1.1;}

/* ===== PIPELINE / KANBAN ===== */
.pipeline-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
.pipeline-selector{background:var(--bg-surface);border:1px solid var(--outline-variant);padding:7px 12px;color:var(--text-main);border-radius:var(--radius-md);outline:none;font-size:13px;cursor:pointer;font-family:var(--font-label);transition:border-color 0.2s;}
.pipeline-selector:hover{border-color:var(--border-hover);}
.kanban-board{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;flex:1;min-height:0;}
.kanban-col{min-width:280px;max-width:280px;display:flex;flex-direction:column;}
.kanban-col-header{display:flex;justify-content:space-between;align-items:center;padding:0 2px 10px;border-bottom:2px solid var(--border-light);margin-bottom:10px;}
.kanban-col-title{font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.07em;font-family:var(--font-label);display:flex;align-items:center;gap:7px;}
.col-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.kanban-col-count{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--surface-variant);color:var(--text-muted);font-family:var(--font-label);}
.kanban-cards{display:flex;flex-direction:column;gap:9px;overflow-y:auto;padding:2px;flex:1;min-height:180px;}

.k-card{background:var(--bg-surface);border:1px solid var(--border-light);padding:12px 14px;border-radius:var(--radius-md);cursor:grab;transition:border-color 0.2s,box-shadow 0.2s,transform 0.12s;box-shadow:var(--card-shadow);border-left:3px solid var(--primary-container);}
.k-card:hover{border-color:var(--border-hover);transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,0.28);}
.k-card:active{cursor:grabbing;transform:scale(0.99);}
.k-card.status-danger{background:rgba(147,0,10,0.28);border-color:rgba(255,180,171,0.5);border-left-color:var(--danger);}
.k-card.status-warning{background:rgba(146,64,14,0.22);border-color:rgba(245,158,11,0.5);border-left-color:var(--warning);}

@keyframes pulseRedBorder{0%{box-shadow:0 0 0 0 rgba(255,180,171,0.5);}70%{box-shadow:0 0 0 6px rgba(255,180,171,0);}100%{box-shadow:0 0 0 0 rgba(255,180,171,0);}}
.k-card.needs-attention{animation:pulseRedBorder 2s infinite;border-color:rgba(255,180,171,0.5);border-left-color:var(--danger);}

.source-badge{padding:2px 7px;font-size:10px;border-radius:4px;color:#fff;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;font-family:var(--font-label);display:inline-block;}
.badge-meta_fb_ads{background:#1877F2;}
.badge-telegram_bot,.badge-telegram_ch{background:#0088cc;}
.badge-phone_call{background:var(--primary-container);}
.badge-referral{background:#9333EA;}
.badge-manual{background:var(--surface-variant);color:var(--text-secondary)!important;}
.badge-website{background:#ea580c;}

/* ===== LEAD PANEL ===== */
.lead-panel-overlay{position:fixed;right:0;top:0;height:100vh;width:860px;max-width:100%;background:var(--bg-base);border-left:1px solid var(--outline-variant);box-shadow:-10px 0 50px rgba(0,0,0,0.6);z-index:100;display:flex;flex-direction:column;}
.lead-panel-header{padding:16px 24px;border-bottom:1px solid var(--outline-variant);display:flex;justify-content:space-between;align-items:center;background:var(--bg-surface);flex-shrink:0;}
.lead-panel-body{flex:1;display:grid;grid-template-columns:340px 1fr;overflow:hidden;min-height:0;}
.lead-profile-col{border-right:1px solid var(--outline-variant);padding:18px 20px;overflow-y:auto;background:var(--bg-surface);}
.lead-chat-col{display:flex;flex-direction:column;overflow:hidden;background:var(--chat-bg);}

.info-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-light);font-size:13px;}
.info-row:last-child{border-bottom:none;}
.info-row-icon{width:28px;height:28px;border-radius:7px;background:var(--surface-variant);display:flex;align-items:center;justify-content:center;color:var(--text-muted);flex-shrink:0;}
.info-label{color:var(--text-muted);font-size:11px;min-width:60px;flex-shrink:0;}
.info-value{color:var(--text-main);font-weight:500;flex:1;text-align:right;font-size:13px;}

/* ===== CHAT ===== */
.chat-logs-area{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:18px;}
.chat-input-area{border-top:1px solid var(--outline-variant);padding:12px 16px;background:var(--bg-surface);display:flex;gap:8px;flex-shrink:0;}
.sys-log{text-align:center;font-size:11px;color:var(--text-muted);background:var(--surface-variant);padding:3px 12px;border-radius:20px;align-self:center;font-weight:500;max-width:90%;}
.msg-bubble{max-width:80%;padding:9px 13px;border-radius:var(--radius-md);font-size:13px;line-height:1.5;}
.msg-in{background:var(--bg-surface);border:1px solid var(--outline-variant);align-self:flex-start;}
.msg-out{background:rgba(1,167,80,0.12);border:1px solid rgba(1,167,80,0.22);align-self:flex-end;color:var(--text-main);}

.lead-pinned-task{background:rgba(245,158,11,0.09);border-bottom:1px solid rgba(245,158,11,0.28);padding:10px 20px;font-size:12px;color:var(--warning);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.operator-bar{padding:7px 18px;background:rgba(59,130,246,0.05);border-bottom:1px solid rgba(59,130,246,0.15);display:flex;align-items:center;gap:8px;font-size:12px;flex-shrink:0;}
.online-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 5px #22c55e;flex-shrink:0;}

/* ===== MODALS ===== */
.login-overlay{position:fixed;inset:0;background:var(--login-overlay-bg);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(12px);}
.login-box{width:400px;padding:40px;background:var(--bg-surface);border:1px solid var(--outline-variant);border-radius:16px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,0.6);}
.large-modal-box{width:880px;max-width:92%;max-height:86vh;padding:28px;background:var(--bg-surface);border:1px solid var(--outline-variant);border-radius:var(--radius-lg);overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,0.6);}

/* ===== TABLES ===== */
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--outline-variant);}
th{color:var(--text-muted);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:0.1em;font-family:var(--font-label);background:var(--surface-container-low);}
tr:hover td{background:var(--surface-variant);}

/* ===== BUTTONS ===== */
.btn-primary{background:var(--primary-container);color:#fff;border:none;padding:8px 16px;border-radius:var(--radius-md);font-weight:600;cursor:pointer;font-size:12px;letter-spacing:0.04em;font-family:var(--font-label);display:inline-flex;align-items:center;gap:6px;box-shadow:0 0 12px rgba(1,167,80,0.2);transition:filter 0.15s,box-shadow 0.15s,transform 0.1s;}
.btn-primary:hover{filter:brightness(1.1);box-shadow:0 0 20px rgba(1,167,80,0.35);}
.btn-primary:active{transform:scale(0.98);}
.btn-outline{background:transparent;color:var(--text-secondary);border:1px solid var(--border-light);padding:8px 16px;border-radius:var(--radius-md);font-weight:500;cursor:pointer;font-size:12px;letter-spacing:0.04em;font-family:var(--font-label);display:inline-flex;align-items:center;gap:6px;transition:background 0.15s,border-color 0.15s,color 0.15s,transform 0.1s;}
.btn-outline:hover{background:var(--bg-hover);border-color:var(--border-hover);color:var(--text-main);}
.btn-outline:active{transform:scale(0.98);}
.btn-success{background:var(--primary-container);color:#fff;border:none;padding:8px 16px;border-radius:var(--radius-md);font-weight:600;cursor:pointer;font-size:12px;letter-spacing:0.04em;font-family:var(--font-label);display:inline-flex;align-items:center;gap:6px;transition:filter 0.15s,transform 0.1s;}
.btn-success:hover{filter:brightness(1.1);}
.btn-success:active{transform:scale(0.98);}
.btn-danger{background:rgba(255,180,171,0.07);color:var(--danger);border:1px solid rgba(255,180,171,0.28);padding:8px 16px;border-radius:var(--radius-md);font-weight:500;cursor:pointer;font-size:12px;letter-spacing:0.04em;font-family:var(--font-label);display:inline-flex;align-items:center;gap:6px;transition:background 0.15s,transform 0.1s;}
.btn-danger:hover{background:rgba(255,180,171,0.15);}
.btn-danger:active{transform:scale(0.98);}

/* ===== INPUTS ===== */
.input-base{width:100%;background:var(--bg-base);border:1px solid var(--outline-variant);padding:9px 12px;border-radius:var(--radius-md);color:var(--text-main);font-size:13px;outline:none;margin-bottom:10px;font-family:var(--font-body);transition:border-color 0.2s,box-shadow 0.2s;}
.input-base:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(90,223,129,0.14);}
.input-base::placeholder{color:var(--text-muted);}
.label-sm{font-size:11px;color:var(--text-muted);margin-bottom:5px;display:block;text-transform:uppercase;font-weight:600;letter-spacing:0.08em;font-family:var(--font-label);}

/* ===== SETTINGS ===== */
.settings-tab-bar{display:flex;gap:4px;background:var(--bg-surface);border:1px solid var(--outline-variant);padding:5px;border-radius:var(--radius-md);margin-bottom:20px;}
.settings-tab{flex:1;text-align:center;padding:9px 8px;font-size:12px;font-weight:500;color:var(--text-secondary);cursor:pointer;border-radius:var(--radius-sm);transition:background 0.15s,color 0.15s;font-family:var(--font-label);display:flex;align-items:center;justify-content:center;gap:6px;}
.settings-tab:hover{background:var(--surface-variant);color:var(--text-main);}
.settings-tab.active{background:var(--surface-container-high);color:var(--primary);font-weight:700;}

/* ===== CHART BARS ===== */
.chart-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.chart-bar-label{font-size:11px;color:var(--text-muted);width:100px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chart-bar-track{flex:1;height:5px;background:var(--surface-variant);border-radius:3px;overflow:hidden;}
.chart-bar-fill{height:100%;border-radius:3px;transition:width 0.5s ease;}
.chart-bar-val{font-size:11px;font-weight:600;color:var(--text-secondary);width:20px;text-align:right;flex-shrink:0;}

/* ===== THEME TRANSITIONS ===== */
.sidebar,.main-wrapper,.topbar,.card,.k-card,.input-base,.btn-primary,.btn-outline,.login-box,.large-modal-box,.lead-panel-overlay{transition:background-color 0.3s,border-color 0.3s,color 0.3s;}

/* ===== PAYMENT BADGES ===== */
.pay-badge{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;font-family:var(--font-label);}
.pay-paid{background:rgba(1,167,80,0.12);color:#01a750;border:1px solid rgba(1,167,80,0.3);}
.pay-pending{background:rgba(245,158,11,0.12);color:#f59e0b;border:1px solid rgba(245,158,11,0.3);}
.pay-debt{background:rgba(239,68,68,0.12);color:#ef4444;border:1px solid rgba(239,68,68,0.3);}

/* ===== STAT MINI CARDS ===== */
.stat-mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.stat-mini{background:var(--bg-surface);border:1px solid var(--outline-variant);border-radius:var(--radius-lg);padding:16px 18px;}
.stat-mini-label{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);font-weight:600;margin-bottom:6px;font-family:var(--font-label);}
.stat-mini-value{font-size:26px;font-weight:700;letter-spacing:-0.03em;}

/* ===== FILTER ROW ===== */
.filter-row{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}

/* ===== MODULE HEADER ===== */
.mod-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;}
.mod-title{font-size:21px;font-weight:700;letter-spacing:-0.5px;}
.mod-sub{font-size:12px;color:var(--text-muted);margin-top:4px;}

/* ===== FB ADS PROGRESS ===== */
.budget-bar{height:4px;background:var(--surface-variant);border-radius:2px;overflow:hidden;margin-top:3px;}
.budget-bar-fill{height:100%;border-radius:2px;background:#1877F2;}
  </style>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // ===== CALL CENTER MODULE =====
    const CallCenterModule = ({ leads, users }) => {
      const allCalls = [];
      leads.forEach(lead => {
        lead.chatLogs.forEach(log => {
          if(log.text && log.text.includes("Qo'ng'iroq")) {
            allCalls.push({
              id: lead.id + '_' + log.date,
              leadName: lead.name,
              phone: lead.phone,
              operator: lead.owner,
              date: log.date,
              note: log.text,
              status: log.text.includes('LOST') ? 'missed' : 'answered'
            });
          }
        });
      });
      allCalls.sort((a, b) => new Date(b.date) - new Date(a.date));

      const totalAttempts = leads.reduce((s, l) => s + (l.actualCallAttempts || 0), 0);
      const answered = allCalls.filter(c => c.status === 'answered').length;
      const missed = allCalls.filter(c => c.status === 'missed').length;
      const activeOps = leads.filter(l => l.actualCallAttempts > 0).length;

      const operatorNames = [...new Set(leads.map(l => l.owner))];

      return (
        <div>
          <div className="mod-header">
            <div>
              <div className="mod-title">Call Center</div>
              <div className="mod-sub">Qo'ng'iroqlar jurnali va VoIP statistikasi</div>
            </div>
          </div>

          <div className="stat-mini-grid">
            {[
              {label:"Jami urinishlar", val:totalAttempts, color:'var(--text-main)'},
              {label:"Javob berildi", val:answered, color:'#01a750'},
              {label:"O'tkazib yuborildi", val:missed, color:'#ef4444'},
              {label:"Faol mijozlar", val:activeOps, color:'#3b82f6'},
            ].map((m, i) => (
              <div key={i} className="stat-mini">
                <div className="stat-mini-label">{m.label}</div>
                <div className="stat-mini-value" style={{color:m.color}}>{m.val}</div>
              </div>
            ))}
          </div>

          <div style={{display:'grid', gridTemplateColumns:'1fr 340px', gap:'14px', marginBottom:'14px'}}>
            <div className="card">
              <div style={{fontWeight:600, fontSize:'14px', marginBottom:'14px'}}>Operatorlar statistikasi</div>
              {operatorNames.map(op => {
                const opLeads = leads.filter(l => l.owner === op);
                const opCalls = opLeads.reduce((s, l) => s + (l.actualCallAttempts||0), 0);
                const opWon = opLeads.filter(l => l.status==='WON').length;
                const maxCalls = Math.max(1, ...operatorNames.map(o => leads.filter(l=>l.owner===o).reduce((s,l)=>s+(l.actualCallAttempts||0),0)));
                return (
                  <div key={op} className="chart-bar-row" style={{marginBottom:'12px', alignItems:'center', gap:'12px'}}>
                    <div className="avatar" style={{width:'28px', height:'28px', fontSize:'11px', flexShrink:0}}>{op[0].toUpperCase()}</div>
                    <div style={{flex:1, minWidth:0}}>
                      <div style={{display:'flex', justifyContent:'space-between', marginBottom:'4px'}}>
                        <span style={{fontSize:'12px', fontWeight:600}}>{op}</span>
                        <span style={{fontSize:'11px', color:'var(--text-muted)'}}>{opCalls} qo'ng'iroq · <span style={{color:'#01a750'}}>{opWon} yutdi</span></span>
                      </div>
                      <div className="chart-bar-track" style={{height:'6px'}}>
                        <div className="chart-bar-fill" style={{width:(opCalls/maxCalls*100)+'%', background:'var(--primary-container)'}}></div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="card" style={{display:'flex', flexDirection:'column', gap:'10px'}}>
              <div style={{fontWeight:600, fontSize:'14px', marginBottom:'6px'}}>VoIP Holati</div>
              <div style={{padding:'16px', background:'var(--bg-hover)', borderRadius:'10px', border:'1px solid var(--border-light)', textAlign:'center', flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'8px'}}>
                <div style={{width:'52px', height:'52px', borderRadius:'50%', background:'rgba(1,167,80,0.1)', border:'2px solid rgba(1,167,80,0.35)', display:'flex', alignItems:'center', justifyContent:'center'}}>
                  <span className="material-symbols-outlined" style={{fontSize:'24px', color:'#01a750'}}>call</span>
                </div>
                <div style={{fontSize:'13px', fontWeight:700, color:'#01a750'}}>Tizim Faol</div>
                <div style={{fontSize:'11px', color:'var(--text-muted)', textAlign:'center'}}>Moizvonki VoIP ulangan</div>
                <code style={{fontSize:'10px', color:'var(--text-muted)', background:'var(--surface-variant)', padding:'3px 8px', borderRadius:'4px'}}>/api/webhook/moizvonki</code>
              </div>
            </div>

          <div className="card" style={{padding:0, overflow:'hidden'}}>

                  <tr><td colSpan="6" style={{textAlign:'center', padding:'40px', color:'var(--text-muted)'}}>Qo'ng'iroqlar topilmadi. Leadga qo'ng'iroq qilgach bu yerda ko'rinadi.</td></tr>
                )}

                    </td>
                    <td style={{fontSize:'11px', color:'var(--text-muted)', maxWidth:'200px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{c.note}</td>
                  </tr>

              </tbody>
            </table>
          </div>
        </div>

    // ===== HISOBOTLAR (REPORTS) MODULE =====
    const HisobotlarModule = ({ leads }) => {
      const sources = ['meta_fb_ads','telegram_bot','phone_call','referral','website','manual'];
      const sourceLabels = { meta_fb_ads:'Facebook Ads', telegram_bot:'Telegram', phone_call:'Telefon', referral:'Tavsiya', website:'Veb-sayt', manual:"Qo'lda" };
      const sourceColors = { meta_fb_ads:'#1877F2', telegram_bot:'#0088cc', phone_call:'#01a750', referral:'#9333EA', website:'#ea580c', manual:'#6b7280' };
      const stages = ['NEW','CONTACTED','QUALIFIED','PROPOSAL','NEGOTIATION','WON','LOST'];
      const stageLabels = { NEW:'Yangi', CONTACTED:'Aloqa', QUALIFIED:'Ehtiyoj', PROPOSAL:'Taklif', NEGOTIATION:'Muzokara', WON:'Yutildi', LOST:"Yo'qotildi" };

      const maxSource = Math.max(1, ...sources.map(s => leads.filter(l => l.source===s).length));
      const maxStage = Math.max(1, ...stages.map(s => leads.filter(l => l.status===s).length));
      const conversion = leads.length ? Math.round(leads.filter(l=>l.status==='WON').length / leads.length * 100) : 0;

      const exportCSV = () => {
        const headers = ['ID','Ism','Telefon','Manzil','Manba','Bosqich',"Mas'ul","Qo'ng'iroqlar"];
        const rows = leads.map(l => [l.id, l.name, l.phone, l.region, l.source, l.status, l.owner, l.actualCallAttempts]);
        const csv = [headers, ...rows].map(r => r.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
        const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'mizon_leads_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
      };

      return (
        <div>
          <div className="mod-header">
            <div>
              <div className="mod-title">Hisobotlar</div>
              <div className="mod-sub">Tahlil, grafik va ma'lumotlarni eksport qilish</div>
            </div>
            <button className="btn-primary" onClick={exportCSV}><Ico n="download" s={14}/> CSV Eksport</button>
          </div>

          <div className="stat-mini-grid">
            {[
              {label:"Jami leadlar", val:leads.length, color:'var(--text-main)'},
              {label:"Konversiya", val:conversion+'%', color:'#01a750'},
              {label:"Yutilgan", val:leads.filter(l=>l.status==='WON').length, color:'#01a750'},
              {label:"Yo'qotilgan", val:leads.filter(l=>l.status==='LOST').length, color:'#ef4444'},
            ].map((m, i) => (
              <div key={i} className="stat-mini">
                <div className="stat-mini-label">{m.label}</div>
                <div className="stat-mini-value" style={{color:m.color}}>{m.val}</div>
              </div>
            ))}
          </div>

          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'14px', marginBottom:'14px'}}>

        let targetLead = null;
        setLeads(prev=>prev.map(l => {
          if(l.id==leadId) { targetLead={...l, status:newStatus, actualCallAttempts:0, chatLogs:[...l.chatLogs,{type:'sys',date:new Date().toISOString(),text:`Bosqich o'zgardi → ${newStatus}. Urinishlar nollashtirildi.`}]}; return targetLead; }
          return l;
        }));
        if(targetLead) setTimeout(()=>syncLeadToAPI(targetLead), 100);
      };

      const handleSendChatMsg = (id) => {
        if(!chatMessageInput.trim()) return;
        setHasUnsavedChanges(true);
        let targetLead = null;
        setLeads(prev=>prev.map(l => {
          if(String(l.id)===String(id)) { targetLead={...l, chatLogs:[...l.chatLogs,{type:'msg',dir:'out',date:new Date().toISOString(),text:chatMessageInput}]}; return targetLead; }
          return l;
        }));
        setChatMessageInput('');
        if(targetLead) setTimeout(()=>syncLeadToAPI(targetLead), 100);
      };

      const handleDragStart = (e, leadId) => { e.dataTransfer.setData('leadId', String(leadId)); };
      const handleDrop = (e, targetStatus) => { e.preventDefault(); const leadId = e.dataTransfer.getData('leadId'); if(leadId) handleStatusChange(leadId, targetStatus); };

      const tabTitles = { dashboard: 'Boshqaruv paneli', leads: 'Sotuv Varonkasi', students: "O'quvchilar", callcenter: 'Call Center', reports: 'Hisobotlar', marketing: 'Marketing Analitika', integrations: 'Integratsiyalar', settings: 'Sozlamalar' };

      // Filtered leads for search
      const filteredActiveLeads = searchQuery.trim()
        ? activeLeads.filter(l => l.name.toLowerCase().includes(searchQuery.toLowerCase()) || (l.phone||'').includes(searchQuery))
        : activeLeads;

      return (
        <div className="app-container">
          {/* SIDEBAR */}
          <aside className="sidebar">
            <div className="sidebar-brand">
              <div className="brand-icon">M</div>
              <span className="brand-name">MIZON</span>
              <span className="brand-role">{role}</span>
            </div>

            <nav className="sidebar-nav">
              <span className="nav-section-label">Asosiy</span>
              <div className={`nav-item ${activeTab==='dashboard'?'active':''}`} onClick={()=>{setActiveTab('dashboard');setSelectedLeadId(null);}}>
                <Ico n="chart" s={17}/> Boshqaruv paneli
              </div>
              <div className={`nav-item ${activeTab==='leads'?'active':''}`} onClick={()=>{setActiveTab('leads');setSelectedLeadId(null);}}>
                <Ico n="funnel" s={17}/> Sotuv Varonkasi
              </div>
              <div className={`nav-item ${activeTab==='students'?'active':''}`} onClick={()=>{setActiveTab('students');setSelectedLeadId(null);}}>
                <span className="material-symbols-outlined" style={{fontSize:'18px', lineHeight:1, flexShrink:0}}>school</span> O'quvchilar
              </div>
              <div className={`nav-item ${activeTab==='callcenter'?'active':''}`} onClick={()=>{setActiveTab('callcenter');setSelectedLeadId(null);}}>
                <span className="material-symbols-outlined" style={{fontSize:'18px', lineHeight:1, flexShrink:0}}>call</span> Call Center
              </div>

              {role === 'CEO' && (
                <>
                  <span className="nav-section-label" style={{marginTop:'8px'}}>Analitika</span>
                  <div className={`nav-item ${activeTab==='reports'?'active':''}`} onClick={()=>{setActiveTab('reports');setSelectedLeadId(null);}}>
                    <span className="material-symbols-outlined" style={{fontSize:'18px', lineHeight:1, flexShrink:0}}>bar_chart_4_bars</span> Hisobotlar
                  </div>
                  <div className={`nav-item ${activeTab==='marketing'?'active':''}`} onClick={()=>{setActiveTab('marketing');setSelectedLeadId(null);}}>
                    <span className="material-symbols-outlined" style={{fontSize:'18px', lineHeight:1, flexShrink:0}}>campaign</span> Marketing
                  </div>
                  <span className="nav-section-label" style={{marginTop:'8px'}}>Boshqaruv</span>
                  <div className={`nav-item ${activeTab==='integrations'?'active':''}`} onClick={()=>{setActiveTab('integrations');setSelectedLeadId(null);}}>
                    <Ico n="plug" s={17}/> Integratsiyalar
                  </div>
                  <div className={`nav-item ${activeTab==='settings'?'active':''}`} onClick={()=>{setActiveTab('settings');setSelectedLeadId(null);}}>
                    <Ico n="settings" s={17}/> Sozlamalar
                  </div>
                </>
              )}
            </nav>

            <div className="sidebar-footer">
              <div className="sidebar-user">
                <div className="avatar" style={{width:'34px', height:'34px', fontSize:'13px'}}>{authUser.username[0].toUpperCase()}</div>
                <div className="sidebar-user-info">
                  <div className="sidebar-user-name">{authUser.username}</div>
                  <div className="sidebar-user-role">{authUser.role}</div>
                </div>
              </div>
              <div className="nav-item" onClick={()=>{setAuthUser(null); localStorage.removeItem('mizon_session');}}>
                <Ico n="logout" s={16}/> Tizimdan chiqish
              </div>
            </div>
          </aside>

          {/* MAIN */}
          <main className="main-wrapper">
            <header className="topbar">
              <span className="topbar-title">{tabTitles[activeTab] || ''}</span>
              <div className="topbar-right">
                {activeTab === 'leads' && (
                  <div className="topbar-search">
                    <span className="topbar-search-icon material-symbols-outlined" style={{fontSize:'17px'}}>search</span>
                    <input placeholder="Qidirish..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} />
                  </div>
                )}
                <button className="icon-btn theme-btn" onClick={()=>setDarkMode(!darkMode)} title={darkMode?'Kunduzgi rejim':'Tungi rejim'}>
                  <span className="material-symbols-outlined" style={{fontSize:'19px'}}>{darkMode?'light_mode':'dark_mode'}</span>
                </button>
                <div className="avatar" style={{width:'32px', height:'32px', fontSize:'12px', cursor:'default'}} title={authUser.username}>
                  {authUser.username[0].toUpperCase()}
                </div>
              </div>
            </header>

            <div className="content-area" style={{position:'relative'}}>

              {/* LEAD DETAIL PANEL */}
              {selectedLeadId && selectedLeadData ? (
                <div className="lead-panel-overlay">
                  <div className="lead-panel-header">
                    <div style={{display:'flex', alignItems:'center', gap:'12px'}}>
                      <div className="avatar" style={{width:'42px', height:'42px', fontSize:'15px'}}>{getInitials(selectedLeadData.name)}</div>
                      <div>
                        <div style={{fontSize:'11px', color:'var(--text-muted)', fontFamily:'var(--font-label)'}}>ID: {selectedLeadData.id} · {selectedLeadData.owner}</div>
                        <div style={{fontSize:'18px', fontWeight:700}}>{selectedLeadData.name}</div>
                      </div>
                      <span style={{marginLeft:'8px', fontSize:'11px', fontWeight:700, padding:'3px 10px', borderRadius:'20px', background:(colColors[selectedLeadData.status]||'#888')+'22', color:colColors[selectedLeadData.status]||'var(--text-muted)'}}>{selectedLeadData.status}</span>
                    </div>
                    {hasUnsavedChanges ? (
                      <button className="btn-success" onClick={()=>{setSelectedLeadId(null);setShowCompleteModal(false);setHasUnsavedChanges(false);}}><Ico n="save" s={14}/> Saqlash va Yopish</button>
                    ) : (
                      <button className="btn-outline" onClick={()=>{setSelectedLeadId(null);setShowCompleteModal(false);}}><Ico n="x" s={14}/> Yopish</button>
                    )}
                  </div>

                  <div className="lead-panel-body">
                    {/* PROFILE COLUMN */}
                    <div className="lead-profile-col">
                      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'12px'}}>
                        <span className="label-sm" style={{marginBottom:0}}>Mijoz ma'lumotlari</span>
                        <button className="btn-outline" style={{padding:'4px 10px', fontSize:'11px'}} onClick={()=>setEditingLead(!editingLead)}>
                          {editingLead ? <><Ico n="check" s={12}/> Saqlash</> : <><Ico n="pencil" s={12}/> Tahrirlash</>}
                        </button>
                      </div>

                      {editingLead ? (
                        <div style={{display:'flex', flexDirection:'column', gap:'4px', marginBottom:'18px'}}>
                          <span className="label-sm">Ism:</span>
                          <input className="input-base" value={selectedLeadData.name} onChange={e=>{setHasUnsavedChanges(true);setLeads(prev=>prev.map(l=>l.id==selectedLeadId?{...l,name:e.target.value}:l));}} />
                          <span className="label-sm">Telefon:</span>
                          <input className="input-base" value={selectedLeadData.phone} onChange={e=>{setHasUnsavedChanges(true);setLeads(prev=>prev.map(l=>l.id==selectedLeadId?{...l,phone:e.target.value}:l));}} />
                          <span className="label-sm">Manzil:</span>
                          <input className="input-base" value={selectedLeadData.region} onChange={e=>{setHasUnsavedChanges(true);setLeads(prev=>prev.map(l=>l.id==selectedLeadId?{...l,region:e.target.value}:l));}} />
                          <span className="label-sm">Manba:</span>
                          <select className="input-base" value={selectedLeadData.source} onChange={e=>{setHasUnsavedChanges(true);setLeads(prev=>prev.map(l=>l.id==selectedLeadId?{...l,source:e.target.value}:l));}}>
                            <option value="meta_fb_ads">Facebook Lead Ads</option>
                            <option value="telegram_bot">Telegram Bot</option>
                            <option value="phone_call">Telefon</option>
                            <option value="referral">Tavsiya</option>
                            <option value="website">Veb-sayt</option>
                            <option value="manual">Qo'lda kiritilgan</option>
                          </select>
                          <span className="label-sm">Mas'ul xodim:</span>
                          <select className="input-base" value={selectedLeadData.owner} onChange={e=>{setHasUnsavedChanges(true);setLeads(prev=>prev.map(l=>l.id==selectedLeadId?{...l,owner:e.target.value}:l));}}>
                            {users.map(u=><option key={u.username} value={u.username}>{u.username} ({u.role})</option>)}
                          </select>
                        </div>
                      ) : (
                        <div style={{marginBottom:'18px'}}>
                          {[
                            {icon:'call', label:'Telefon', value:selectedLeadData.phone},
                            {icon:'location_on', label:'Manzil', value:selectedLeadData.region},
                            {icon:'person', label:'Mas\'ul', value:selectedLeadData.owner},
                          ].map(row => (
                            <div key={row.label} className="info-row">
                              <div className="info-row-icon"><span className="material-symbols-outlined" style={{fontSize:'15px'}}>{row.icon}</span></div>
                              <span className="info-label">{row.label}</span>
                              <span className="info-value">{row.value}</span>
                            </div>
                          ))}
                          <div className="info-row">
                            <div className="info-row-icon"><span className="material-symbols-outlined" style={{fontSize:'15px'}}>label</span></div>
                            <span className="info-label">Manba</span>
                            <span className="info-value"><span className={`source-badge badge-${selectedLeadData.source}`}>{selectedLeadData.source.replace('meta_','')}</span></span>
                          </div>
                        </div>
                      )}

                      <span className="label-sm">SLA va Vazifa</span>
                      {selectedLeadData.deadline ? (
                        <div style={{padding:'14px', borderRadius:'8px', marginBottom:'16px',
                          background:determineSLAType(selectedLeadData.deadline)==='danger'?'var(--danger-bg)':determineSLAType(selectedLeadData.deadline)==='warning'?'var(--warning-bg)':'var(--bg-base)',
                          border:`1px solid ${determineSLAType(selectedLeadData.deadline)==='danger'?'rgba(255,180,171,0.5)':determineSLAType(selectedLeadData.deadline)==='warning'?'rgba(245,158,11,0.5)':'var(--border-light)'}`
                        }}>
                          <div style={{fontSize:'11px', color:'rgba(255,255,255,0.65)', textTransform:'uppercase', marginBottom:'4px'}}>Muddat:</div>
                          <div style={{fontSize:'13px', fontWeight:600, color:'#fff', marginBottom:'10px'}}>
                            <Ico n="clock" s={13}/> {new Date(selectedLeadData.deadline).toLocaleString()}
                          </div>
                          {!showCompleteModal ? (
                            <button className="btn-success" style={{width:'100%'}} onClick={()=>setShowCompleteModal(true)}>
                              <Ico n="check" s={13}/> Vazifani yakunlash
                            </button>
                          ) : (
                            <div style={{padding:'10px', background:'rgba(0,0,0,0.4)', borderRadius:'6px'}}>
                              <span className="label-sm">Yakunlash sababi:</span>
                              <input className="input-base" placeholder="Natija: Shartnoma imzolandi..." value={taskCompleteNote} onChange={e=>setTaskCompleteNote(e.target.value)} />
                              <div style={{display:'flex', gap:'8px'}}>
                                <button className="btn-success" style={{flex:1}} onClick={()=>handleTaskComplete(selectedLeadData.id)}>Tasdiqlash</button>
                                <button className="btn-outline" style={{padding:'0 10px'}} onClick={()=>setShowCompleteModal(false)}>✕</button>
                              </div>
                            </div>
                          )}
                        </div>
                      ) : (
                        <div style={{padding:'14px', borderRadius:'8px', marginBottom:'16px', background:'var(--bg-hover)', border:'1px solid var(--border-light)'}}>
                          <div style={{fontSize:'12px', color:'var(--danger)', fontWeight:600, marginBottom:'10px', display:'flex', alignItems:'center', gap:'5px'}}><Ico n="alert" s={13}/> Vazifa biriktirilmagan!</div>
                          <input className="input-base" placeholder="Vazifa izoh (matn)..." value={taskDescInput} onChange={e=>setTaskDescInput(e.target.value)} />
                          <input type="datetime-local" className="input-base" value={taskDateInput} onChange={e=>setTaskDateInput(e.target.value)} />
                          <button className="btn-primary" style={{width:'100%'}} onClick={()=>handleTaskCreate(selectedLeadData.id)}>Vazifani belgilash</button>
                        </div>
                      )}

                      <span className="label-sm">Qo'ng'iroq</span>
                      <button className="btn-outline" style={{width:'100%', marginBottom:'14px'}} onClick={()=>handleLogCall(selectedLeadData.id)}>
                        <Ico n="phone" s={14}/> Qo'ng'iroq ({selectedLeadData.actualCallAttempts} / {globalCallLimit})
                      </button>

                      <span className="label-sm">Bosqichni o'zgartirish</span>
                      <select className="input-base" value={selectedLeadData.status} onChange={e=>handleStatusChange(selectedLeadData.id, e.target.value)}>
                        {columnsMap[selectedLeadData.pipelineId]?.map(c=><option key={c.id} value={c.id}>{c.title}</option>)}
                      </select>
                    </div>

                    {/* CHAT COLUMN */}
                    <div className="lead-chat-col">
                      <div className="operator-bar">
                        <span className="online-dot"></span>
                        <span style={{color:'var(--text-secondary)'}}>
                          <b style={{color:'var(--accent)'}}>{authUser.username}</b> hozir bu oynada ishlayapti
                        </span>
                        {selectedLeadData.owner !== authUser.username && (
                          <span style={{marginLeft:'auto', background:'rgba(245,158,11,0.12)', border:'1px solid rgba(245,158,11,0.3)', color:'#f59e0b', padding:'2px 8px', borderRadius:'10px', fontSize:'11px'}}>
                            <Ico n="alert" s={10}/> Mas'ul: {selectedLeadData.owner}
                          </span>
                        )}
                      </div>
                      {selectedLeadData.deadline && selectedLeadData.taskDescription && (
                        <div className="lead-pinned-task">
                          <Ico n="pin" s={13}/> <strong>Faol Vazifa:</strong> <span>{selectedLeadData.taskDescription}</span>
                        </div>
                      )}
                      <div className="chat-logs-area">
                        {selectedLeadData.chatLogs.map((log, idx) => {
                          if(log.type==='sys') return <div key={idx} className="sys-log">{new Date(log.date).toLocaleTimeString()} — {log.text}</div>;
                          return <div key={idx} className={`msg-bubble ${log.dir==='in'?'msg-in':'msg-out'}`}>{log.text}</div>;
                        })}
                      </div>
                      <div className="chat-input-area">
                        <input id="chatMessageInputBox" className="input-base" style={{marginBottom:0}} placeholder="Izoh yoki qayd yozib qoldirish..." value={chatMessageInput} onChange={e=>setChatMessageInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter') handleSendChatMsg(selectedLeadData.id);}} />
                        <button className="btn-primary" onClick={()=>handleSendChatMsg(selectedLeadData.id)}>Yuborish</button>
                      </div>
                    </div>
                  </div>
                </div>
              ) : null}

              {/* ADD LEAD MODAL */}
              {showAddLead && (
                <div className="login-overlay" onClick={e=>{if(e.target===e.currentTarget) setShowAddLead(false);}}>
                  <div className="login-box" style={{width:'420px'}} onKeyDown={e=>{if(e.key==='Enter'&&newLeadForm.name&&newLeadForm.phone){e.preventDefault();handleAddManualLead();}}}>
                    <h2 style={{marginBottom:'20px', letterSpacing:'-0.4px', fontSize:'18px', fontWeight:700}}>Yangi Lead Qo'shish</h2>
                    <div style={{display:'flex', flexDirection:'column', gap:'6px', textAlign:'left'}}>
                      <span className="label-sm">Ism-familiya *</span>
                      <input className="input-base" autoFocus placeholder="Sardor Odilov" value={newLeadForm.name} onChange={e=>setNewLeadForm({...newLeadForm,name:e.target.value})} />
                      <span className="label-sm">Telefon *</span>
                      <input className="input-base" placeholder="+998 XX XXX XX XX" value={newLeadForm.phone} onChange={e=>setNewLeadForm({...newLeadForm,phone:e.target.value})} />
                      <span className="label-sm">Manzil</span>
                      <input className="input-base" placeholder="Toshkent, Yunusobod..." value={newLeadForm.region} onChange={e=>setNewLeadForm({...newLeadForm,region:e.target.value})} />
                    </div>
                    <div style={{display:'flex', gap:'10px', marginTop:'16px'}}>
                      <button className="btn-primary" style={{flex:1}} onClick={handleAddManualLead}>Qo'shish</button>
                      <button className="btn-outline" onClick={()=>setShowAddLead(false)}>Bekor</button>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB CONTENT */}
              {activeTab === 'dashboard' && <DashboardOverview leads={leads} role={role} setSelectedLeadId={setSelectedLeadId} />}

              {activeTab === 'students' && <StudentsModule />}

              {activeTab === 'callcenter' && <CallCenterModule leads={leads} users={users} />}

              {activeTab === 'reports' && role === 'CEO' && <HisobotlarModule leads={leads} />}

              {activeTab === 'marketing' && role === 'CEO' && <MarketingModule />}

              {activeTab === 'integrations' && <IntegrationsModule />}

              {activeTab === 'leads' && (
                <div style={{display:'flex', flexDirection:'column', height:'100%'}}>
                  <div className="pipeline-header">
                    <h2 style={{fontSize:'18px', fontWeight:700, letterSpacing:'-0.4px'}}>Sotuv Varonkasi</h2>
                    <div style={{display:'flex', gap:'12px', alignItems:'center'}}>
                      <select className="pipeline-selector" value={activePipe} onChange={e=>setActivePipe(e.target.value)}>
                        {pipelines.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                      </select>
                      <button className="btn-primary" onClick={()=>setShowAddLead(true)}>
                        <Ico n="plus" s={14}/> Yangi Lead
                      </button>
                    </div>
                  </div>

                  <div className="kanban-board">
                    {activeColumns.map(col => {
                      const colLeads = filteredActiveLeads.filter(l => l.status === col.id);
                      const dotColor = colColors[col.id] || '#888';
                      return (
                        <div key={col.id} className="kanban-col" onDragOver={e=>e.preventDefault()} onDrop={e=>handleDrop(e, col.id)}>
                          <div className="kanban-col-header">
                            <span className="kanban-col-title">
                              <span className="col-dot" style={{background:dotColor}}></span>
                              {col.title}
                            </span>
                            <span className="kanban-col-count">{colLeads.length}</span>
                          </div>
                          <div className="kanban-cards">
                            {colLeads.map(lead => {
                              const sla = determineSLAType(lead.deadline);
                              const hasTask = lead.deadline || lead.taskDescription;
                              let customClass = '';
                              if(sla==='danger') customClass = 'status-danger';
                              else if(sla==='warning') customClass = 'status-warning';
                              else if(!hasTask && !['NEW','LOST','WON'].includes(lead.status)) customClass = 'needs-attention';
                              return (
                                <div key={lead.id} className={`k-card ${customClass}`}
                                  style={{borderLeftColor: customClass ? undefined : dotColor}}
                                  draggable={true}
                                  onDragStart={e=>handleDragStart(e, lead.id)}
                                  onClick={()=>setSelectedLeadId(lead.id)}>
                                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'8px'}}>
                                    <span className={`source-badge badge-${lead.source}`}>{lead.source.replace('meta_','')}</span>
                                    {sla==='danger' && <span style={{fontSize:'10px', background:'rgba(255,180,171,0.15)', color:'var(--danger)', padding:'2px 6px', borderRadius:'4px', fontWeight:700, display:'flex', alignItems:'center', gap:'3px'}}><Ico n="alarm" s={10}/> KECHIKDI</span>}
                                    {sla==='warning' && <span style={{fontSize:'10px', background:'rgba(245,158,11,0.15)', color:'var(--warning)', padding:'2px 6px', borderRadius:'4px', fontWeight:700, display:'flex', alignItems:'center', gap:'3px'}}><Ico n="clock" s={10}/> TEZ ORADA</span>}
                                  </div>
                                  <div style={{fontWeight:600, fontSize:'14px', color:'var(--text-main)', marginBottom:'4px', lineHeight:1.3}}>{lead.name}</div>
                                  <div style={{fontSize:'12px', color:'var(--text-muted)', marginBottom:'8px', display:'flex', alignItems:'center', gap:'6px'}}>
                                    <Ico n="phone" s={11}/> {lead.actualCallAttempts} urinish
                                    <span style={{width:'3px', height:'3px', borderRadius:'50%', background:'var(--text-muted)', display:'inline-block'}}></span>
                                    <Ico n="user" s={11}/> {lead.owner}
                                  </div>
                                  {(lead.taskDescription||lead.deadline) ? (
                                    <div style={{fontSize:'11px', background:'rgba(255,255,255,0.04)', padding:'5px 8px', borderRadius:'5px', border:'1px solid rgba(255,255,255,0.08)', color:'var(--text-secondary)'}}>
                                      {lead.taskDescription ? <span><Ico n="message" s={10}/> {lead.taskDescription.substring(0,32)}...</span> : <span style={{color:'var(--text-muted)'}}><Ico n="clock" s={10}/> Muddat belgilangan</span>}
                                    </div>
                                  ) : (
                                    !['NEW','LOST','WON'].includes(lead.status) && (
                                      <div style={{fontSize:'10px', background:'rgba(255,180,171,0.08)', color:'var(--danger)', padding:'4px 7px', borderRadius:'4px', border:'1px solid rgba(255,180,171,0.25)', fontWeight:700}}>
                                        <Ico n="alert" s={10}/> Vazifa belgilanmagan!
                                      </div>
                                    )
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {activeTab === 'settings' && role === 'CEO' && (
                <div style={{maxWidth:'780px', margin:'0 auto'}}>
                  <div className="settings-tab-bar">
                    <div className={`settings-tab ${settingsActiveTab==='users'?'active':''}`} onClick={()=>setSettingsActiveTab('users')}><Ico n="users" s={14}/> Xodimlar</div>
                    <div className={`settings-tab ${settingsActiveTab==='limits'?'active':''}`} onClick={()=>setSettingsActiveTab('limits')}><Ico n="settings" s={14}/> Sozlamalar</div>
                    <div className={`settings-tab ${settingsActiveTab==='pipelines'?'active':''}`} onClick={()=>setSettingsActiveTab('pipelines')}><Ico n="layers" s={14}/> Varonkalar</div>
                    <div className={`settings-tab ${settingsActiveTab==='webforms'?'active':''}`} onClick={()=>setSettingsActiveTab('webforms')}><Ico n="file" s={14}/> Veb Shakl</div>
                  </div>
                  <div className="card" style={{minHeight:'400px'}}>
                    {settingsActiveTab==='users' && (
                      <div>
                        <h3 style={{marginBottom:'14px', fontWeight:600}}>Tizim Xodimlari</h3>
                        <UserManagement users={users} setUsers={setUsers} />
                      </div>
                    )}
                    {settingsActiveTab==='limits' && (
                      <div>
                        <h3 style={{marginBottom:'14px', fontWeight:600}}>Global Ko'rsatkichlar</h3>
                        <GlobalLimitsConfig globalCallLimit={globalCallLimit} setGlobalCallLimit={setGlobalCallLimit} />
                      </div>
                    )}
                    {settingsActiveTab==='pipelines' && (
                      <div>
                        <h3 style={{marginBottom:'14px', fontWeight:600}}>Varonkalarni Sozlash</h3>
                        <PipelineEditor pipelines={pipelines} setPipelines={setPipelines} columnsMap={columnsMap} setColumnsMap={setColumnsMap} />
                      </div>
                    )}
                    {settingsActiveTab==='webforms' && (
                      <div>
                        <h3 style={{marginBottom:'14px', fontWeight:600}}>Forma Konstruktori</h3>
                        <p style={{fontSize:'12px', color:'var(--text-muted)', marginBottom:'14px'}}>Tashqi formada foydalanuvchilarga ko'rsatiladigan savollarni belgilang.</p>
                        <div style={{display:'flex', flexDirection:'column', gap:'7px', marginBottom:'20px'}}>
                          {formFields.map((f, idx) => (
                            <div key={f.id} style={{display:'flex', gap:'8px', alignItems:'center', padding:'10px', background:'var(--bg-base)', border:'1px solid var(--border-light)', borderRadius:'8px'}}>
                              <span style={{color:'var(--text-muted)', fontSize:'12px', width:'20px'}}>{idx+1}</span>
                              <input className="input-base" style={{marginBottom:0, flex:2}} placeholder="Savol nomi" value={f.label} onChange={e=>setFormFields(formFields.map(x=>x.id===f.id?{...x,label:e.target.value}:x))} />
                              <input className="input-base" style={{marginBottom:0, flex:1}} placeholder="key" value={f.key} onChange={e=>setFormFields(formFields.map(x=>x.id===f.id?{...x,key:e.target.value}:x))} />
                              <select className="input-base" style={{marginBottom:0, width:'90px'}} value={f.type} onChange={e=>setFormFields(formFields.map(x=>x.id===f.id?{...x,type:e.target.value}:x))}>
                                <option value="text">Matn</option>
                                <option value="tel">Telefon</option>
                                <option value="email">Email</option>
                                <option value="number">Raqam</option>
                              </select>
                              <label style={{fontSize:'11px', color:'var(--text-muted)', display:'flex', alignItems:'center', gap:'4px', cursor:'pointer', whiteSpace:'nowrap'}}>
                                <input type="checkbox" checked={f.required} onChange={e=>setFormFields(formFields.map(x=>x.id===f.id?{...x,required:e.target.checked}:x))} /> Majburiy
                              </label>
                              <button className="btn-danger" style={{padding:'4px 8px'}} onClick={()=>setFormFields(formFields.filter(x=>x.id!==f.id))}>&times;</button>
                            </div>
                          ))}
                          <button className="btn-outline" onClick={()=>setFormFields([...formFields,{id:'f_'+Date.now(), label:'', key:'custom_'+Date.now(), type:'text', required:false, placeholder:''}])}>+ Yangi savol qo'shish</button>
                        </div>

                        <div style={{borderTop:'1px solid var(--border-light)', paddingTop:'20px'}}>
                          <div style={{display:'flex', alignItems:'center', gap:'10px', marginBottom:'14px'}}>
                            <div style={{width:'34px', height:'34px', background:'linear-gradient(135deg, var(--accent), #8b5cf6)', borderRadius:'9px', display:'flex', alignItems:'center', justifyContent:'center', color:'#fff'}}>
                              <Ico n="link" s={16} c={{color:'#fff'}}/>
                            </div>
                            <div>
                              <div style={{fontWeight:600, fontSize:'13px'}}>Havola Yaratish</div>
                              <div style={{fontSize:'11px', color:'var(--text-muted)'}}>Tashqi forma URL havolasini oling</div>
                            </div>
                          </div>
                          <div style={{display:'flex', gap:'10px', alignItems:'stretch'}}>
                            <select id="formPipeSelect" className="input-base" style={{marginBottom:0, flex:1}} defaultValue="">
                              <option value="" disabled>Quvurni tanlang...</option>
                              {pipelines.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                            </select>
                            <button className="btn-primary" style={{whiteSpace:'nowrap'}} onClick={()=>{
                              const sel = document.getElementById('formPipeSelect');
                              if(!sel.value) return alert('Avval quvurni tanlang!');
                              const lnk = window.location.origin + window.location.pathname + '?leadForm=true&pipe=' + sel.value;
                              navigator.clipboard.writeText(lnk).then(()=>{
                                const linkBox = document.getElementById('generatedLinkBox');
                                if(linkBox){linkBox.value=lnk;linkBox.parentElement.style.display='flex';}
                              });
                            }}>
                              <Ico n="link" s={13}/> Nusxalash
                            </button>
                          </div>
                          <div id="generatedLinkWrap" style={{display:'none', marginTop:'10px', gap:'8px', alignItems:'center'}}>
                            <input id="generatedLinkBox" className="input-base" readOnly style={{marginBottom:0, flex:1, fontSize:'12px', fontFamily:'monospace', color:'var(--success)'}} />
                            <span style={{fontSize:'11px', color:'var(--success)', fontWeight:600, whiteSpace:'nowrap'}}><Ico n="check" s={13}/> Nusxalandi!</span>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}

            </div>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
