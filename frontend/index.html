  <style>
/* ===== MIZON CRM — DESIGN SYSTEM (Dark default, Material 3 inspired emerald palette) ===== */
:root, [data-theme="dark"] {
  --bg-base: #100F0F;
  --bg-surface: #1A1919;
  --bg-hover: #2A2A2A;

  --surface-container-low: #1c1b1b;
  --surface-container: #211f1f;
  --surface-container-high: #2b2a29;
  --surface-variant: #363434;

  --primary: #5adf81;
  --primary-container: #01a750;
  --primary-invert: #003917;
  --accent: #5adf81;

  --text-main: #e6e1e1;
  --text-secondary: #bccaba;
  --text-muted: #879486;

  --border-light: #2A2A2A;
  --border-hover: #3d4a3e;
  --outline-variant: #3d4a3e;

  --danger: #ffb4ab;
  --danger-bg: #93000a;
  --warning: #f59e0b;
  --warning-bg: #92400e;
  --success: #5adf81;
  --success-bg: rgba(90,223,129,0.08);

  --font-body: 'Inter', sans-serif;
  --font-label: 'Geist', 'Inter', sans-serif;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;

  --brand-color: #5adf81;
  --login-overlay-bg: rgba(10,10,10,0.8);
  --chat-bg: #100F0F;
  --card-shadow: 0 2px 8px rgba(0,0,0,0.35);
}

/* ===== LIGHT THEME ===== */
[data-theme="light"] {
  --bg-base: #f6f8f6;
  --bg-surface: #ffffff;
  --bg-hover: #eef2ee;

  --surface-container-low: #f1f5f1;
  --surface-container: #ffffff;
  --surface-container-high: #e8efe8;
  --surface-variant: #dde5dd;

  --primary: #01a750;
  --primary-container: #01a750;
  --primary-invert: #ffffff;
  --accent: #01a750;

  --text-main: #131613;
  --text-secondary: #3f4a3f;
  --text-muted: #6b7a6b;

  --border-light: #d8e0d8;
  --border-hover: #aebdae;
  --outline-variant: #c8d2c8;

  --danger: #b3261e;
  --danger-bg: #ffe7e3;
  --warning: #b35a00;
  --warning-bg: #fff1d6;
  --success: #01a750;
  --success-bg: rgba(1,167,80,0.1);

  --brand-color: #01a750;
  --login-overlay-bg: rgba(255,255,255,0.85);
  --chat-bg: #f1f5f1;
  --card-shadow: 0 2px 12px rgba(0,0,0,0.06);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { background-color: var(--bg-base); color: var(--text-main); font-family: var(--font-body); font-size: 14px; min-height: 100vh; overflow-x: hidden; transition: background-color 0.3s, color 0.3s; -webkit-font-smoothing: antialiased; }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-variant); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

/* Structural */
.app-container { display: flex; height: 100vh; }
.sidebar { width: 260px; background: var(--bg-surface); border-right: 1px solid var(--outline-variant); display: flex; flex-direction: column; padding: 16px 12px; z-index: 10; }
.brand { font-size: 20px; font-weight: 700; color: var(--brand-color); margin-bottom: 32px; padding: 4px 12px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; line-height: 1.1; }

.nav-item { padding: 10px 12px; border-radius: var(--radius-md); color: var(--text-secondary); cursor: pointer; margin-bottom: 4px; font-weight: 500; font-size: 12px; letter-spacing: 0.04em; display: flex; align-items: center; gap: 12px; transition: background-color 0.2s, color 0.2s, transform 0.1s; font-family: var(--font-label); border-left: 4px solid transparent; }
.nav-item:hover { background: var(--surface-variant); color: var(--text-main); }
.nav-item:active { transform: scale(0.97); }
.nav-item.active { background: var(--surface-container-high); color: var(--primary); border-left-color: var(--primary); font-weight: 700; }

.main-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-base); }
.topbar { height: 64px; border-bottom: 1px solid var(--outline-variant); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--bg-surface); position: sticky; top: 0; z-index: 20; }
.search-bar { background: var(--bg-base); border: 1px solid var(--outline-variant); padding: 8px 14px; border-radius: var(--radius-md); color: var(--text-main); width: 280px; font-size: 13px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
.search-bar:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(90,223,129,0.15); }

.content-area { flex: 1; overflow-y: auto; padding: 24px 32px 32px; }

/* Cards */
.grid-cols-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.grid-cols-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.card { background: var(--bg-surface); border: 1px solid var(--outline-variant); border-radius: var(--radius-lg); padding: 20px; transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s; position: relative; overflow: hidden; }
.card.clickable { cursor: pointer; }
.card.clickable:hover { border-color: var(--border-hover); transform: translateY(-2px); box-shadow: 0 4px 24px rgba(0,0,0,0.25); }
.card-title { color: var(--text-secondary); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 12px; font-family: var(--font-label); }
.card-value { font-size: 32px; font-weight: 700; color: var(--text-main); letter-spacing: -0.02em; line-height: 1.1; }

/* Pipeline / Kanban */
.pipeline-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.pipeline-selector { background: var(--bg-surface); border: 1px solid var(--outline-variant); padding: 8px 14px; color: var(--text-main); border-radius: var(--radius-md); outline: none; font-size: 13px; cursor: pointer; font-family: var(--font-label); transition: border-color 0.2s; }
.pipeline-selector:hover { border-color: var(--border-hover); }
.kanban-board { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 20px; height: calc(100vh - 200px); }
.kanban-col { min-width: 300px; max-width: 300px; background: transparent; display: flex; flex-direction: column; gap: 12px; }
.kanban-col-header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 600; color: #BDBDBD; margin-bottom: 4px; padding: 0 4px 8px; border-bottom: 1px solid var(--border-light); text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--font-label); }
.kanban-col-count { background: var(--surface-variant); color: var(--text-secondary); padding: 2px 10px; border-radius: 9999px; border: none; font-size: 11px; font-weight: 600; font-family: var(--font-label); }
.kanban-cards { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding: 4px; min-height: 200px; }
.k-card { background: var(--bg-surface); border: 1px solid var(--border-light); padding: 14px; border-radius: var(--radius-md); cursor: grab; transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s; position: relative; box-shadow: var(--card-shadow); border-left: 4px solid var(--primary); }
.k-card:hover { border-color: var(--border-hover); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
.k-card:active { cursor: grabbing; transform: scale(0.98); }

/* Source Badges */
.source-badge { padding: 3px 8px; font-size: 10px; border-radius: 4px; color: #fff; font-weight: 600; text-transform: uppercase; align-self: flex-start; letter-spacing: 0.04em; font-family: var(--font-label); }
.badge-meta_fb_ads { background: #1877F2; }
.badge-telegram_bot { background: #0088cc; }
.badge-telegram_ch { background: #0088cc; }
.badge-phone_call { background: var(--primary-container); }
.badge-referral { background: #9333EA; }
.badge-manual { background: var(--surface-variant); color: var(--text-secondary); }
.badge-website { background: #ea580c; }

/* SLA animations */
@keyframes pulseRedBorder {
  0% { box-shadow: 0 0 0 0 rgba(255, 180, 171, 0.55); }
  70% { box-shadow: 0 0 0 6px rgba(255, 180, 171, 0); }
  100% { box-shadow: 0 0 0 0 rgba(255, 180, 171, 0); }
}

.k-card.needs-attention { animation: pulseRedBorder 2s infinite; border: 1px solid var(--danger); }
.k-card.status-danger { background-color: var(--danger-bg); border-color: var(--danger); color: #fff; }
.k-card.status-warning { background-color: var(--warning-bg); border-color: var(--warning); color: #fff; }
.k-card.status-danger .text-muted, .k-card.status-warning .text-muted { color: rgba(255,255,255,0.75); }

/* Overlays & Modals */
.lead-panel-overlay { position: fixed; right: 0; top: 0; height: 100vh; width: 840px; max-width: 100%; background: var(--bg-base); border-left: 1px solid var(--outline-variant); box-shadow: -10px 0 40px rgba(0,0,0,0.55); z-index: 100; display: flex; flex-direction: column; }
.lead-panel-header { padding: 20px 24px; border-bottom: 1px solid var(--outline-variant); display: flex; justify-content: space-between; align-items: center; background: var(--bg-surface); }
.lead-panel-body { flex: 1; display: grid; grid-template-columns: 360px 1fr; overflow: hidden; }
.lead-profile-col { border-right: 1px solid var(--outline-variant); padding: 20px; overflow-y: auto; background: var(--bg-surface); }
.lead-chat-col { display: flex; flex-direction: column; overflow: hidden; background: var(--chat-bg); }

/* Theme Toggle */
.theme-toggle { background: var(--bg-surface); border: 1px solid var(--outline-variant); width: 40px; height: 40px; border-radius: 9999px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); transition: background-color 0.2s, border-color 0.2s, transform 0.3s, color 0.2s; }
.theme-toggle:hover { background: var(--surface-variant); border-color: var(--border-hover); transform: rotate(30deg); color: var(--primary); }

/* Smooth transitions */
.sidebar, .main-wrapper, .topbar, .card, .k-card, .kanban-col, .input-base, .btn-primary, .btn-outline, .login-box, .large-modal-box, .lead-panel-overlay { transition: background-color 0.3s, border-color 0.3s, color 0.3s, box-shadow 0.3s; }

.login-overlay { position: fixed; inset: 0; background: var(--login-overlay-bg); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(8px); }
.login-box { width: 400px; padding: 40px; background: var(--bg-surface); border: 1px solid var(--outline-variant); border-radius: var(--radius-lg); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.large-modal-box { width: 880px; max-width: 92%; max-height: 84vh; padding: 28px; background: var(--bg-surface); border: 1px solid var(--outline-variant); border-radius: var(--radius-lg); overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }

/* Tables */
table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid var(--outline-variant); }
th { color: #BDBDBD; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.08em; font-family: var(--font-label); background: var(--surface-container-low); }
tr { transition: background-color 0.15s; }
tr:hover td { background: var(--surface-variant); }

/* Buttons */
.btn-primary { background: var(--primary-container); color: #fff; border: 1px solid var(--primary-container); padding: 8px 16px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; font-size: 12px; letter-spacing: 0.04em; transition: filter 0.15s, transform 0.1s, box-shadow 0.2s; font-family: var(--font-label); display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 12px rgba(1,167,80,0.2); }
.btn-primary:hover { filter: brightness(1.1); box-shadow: 0 0 18px rgba(1,167,80,0.35); }
.btn-primary:active { transform: scale(0.98); }

.btn-outline { background: transparent; color: #EDE4DE; border: 1px solid var(--border-light); padding: 8px 16px; border-radius: var(--radius-md); font-weight: 500; cursor: pointer; font-size: 12px; letter-spacing: 0.04em; transition: background-color 0.15s, border-color 0.15s, transform 0.1s; font-family: var(--font-label); display: inline-flex; align-items: center; gap: 6px; }
.btn-outline:hover { background: var(--bg-hover); border-color: var(--border-hover); }
.btn-outline:active { transform: scale(0.98); }

.btn-danger { background: rgba(255,180,171,0.08); color: var(--danger); border: 1px solid rgba(255,180,171,0.4); padding: 8px 16px; border-radius: var(--radius-md); font-weight: 500; cursor: pointer; font-size: 12px; letter-spacing: 0.04em; transition: background-color 0.15s, transform 0.1s; font-family: var(--font-label); display: inline-flex; align-items: center; gap: 6px; }
.btn-danger:hover { background: rgba(255,180,171,0.16); }
.btn-danger:active { transform: scale(0.98); }

.btn-success { background: var(--primary-container); color: #fff; border: 1px solid var(--primary-container); padding: 8px 16px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; font-size: 12px; letter-spacing: 0.04em; transition: filter 0.15s, transform 0.1s, box-shadow 0.2s; font-family: var(--font-label); display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 12px rgba(1,167,80,0.2); }
.btn-success:hover { filter: brightness(1.1); box-shadow: 0 0 18px rgba(1,167,80,0.35); }
.btn-success:active { transform: scale(0.98); }

/* Inputs */
.input-base { width: 100%; background: var(--bg-base); border: 1px solid var(--outline-variant); padding: 10px 12px; border-radius: var(--radius-md); color: var(--text-main); font-size: 13px; outline: none; margin-bottom: 12px; font-family: var(--font-body); transition: border-color 0.2s, box-shadow 0.2s; }
.input-base:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(90,223,129,0.18); }
.input-base::placeholder { color: var(--text-muted); }
.label-sm { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; display: block; text-transform: uppercase; font-weight: 600; letter-spacing: 0.08em; font-family: var(--font-label); }

/* Chat */
.chat-logs-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 24px; }
.chat-input-area { border-top: 1px solid var(--outline-variant); padding: 16px 24px; background: var(--bg-surface); display: flex; gap: 8px; }
.sys-log { text-align: center; font-size: 11px; color: var(--text-muted); background: var(--surface-variant); padding: 4px 10px; border-radius: 4px; align-self: center; font-weight: 500; }
.msg-bubble { max-width: 85%; padding: 10px 14px; border-radius: var(--radius-md); font-size: 13px; line-height: 1.5; }
.msg-in { background: var(--bg-surface); border: 1px solid var(--outline-variant); align-self: flex-start; }
.msg-out { background: var(--surface-container-high); border: 1px solid var(--outline-variant); align-self: flex-end; color: var(--text-main); }

.lead-pinned-task { background: rgba(245,158,11,0.12); border-bottom: 1px solid rgba(245,158,11,0.4); padding: 12px 24px; font-size: 12px; color: var(--warning); display: flex; flex-direction: column; gap: 4px; }

/* Tab Bar */
.settings-tab-bar { display: flex; gap: 4px; background: var(--bg-surface); border: 1px solid var(--outline-variant); padding: 6px; border-radius: var(--radius-md); margin-bottom: 24px; }
.settings-tab { flex: 1; text-align: center; padding: 10px; font-size: 12px; font-weight: 500; color: var(--text-secondary); cursor: pointer; border-radius: var(--radius-sm); transition: background-color 0.2s, color 0.2s; font-family: var(--font-label); letter-spacing: 0.04em; display: flex; align-items: center; justify-content: center; gap: 6px; }
.settings-tab:hover { background: var(--surface-variant); color: var(--text-main); }
.settings-tab.active { background: var(--surface-container-high); color: var(--primary); font-weight: 700; }

                           <strong style={{color:'var(--success)'}}>{k.token}</strong>
                           <div style={{display:'flex', gap:'8px'}}>
                              <button className="btn-success" style={{background:'rgba(16,185,129,0.2)', color:'var(--success)', border:'1px solid var(--success)'}} onClick={()=>copySysKey(k.token)}>Nusxa olish</button>
                              <button className="btn-outline" style={{borderColor: 'var(--danger)', color: 'var(--danger)'}} onClick={()=>deleteSysKey(k.id)}>O'chirish</button>
                           </div>
                        </div>
                     ))}
                  </div>
               )}
            </div>

            <div className="card">
               <h3 style={{marginBottom: '16px'}}>Boshqa manbalar (Webhook, Meta, Telegram) qo'shish</h3>
               <div style={{ padding: '16px', background: 'var(--bg-hover)', border: '1px solid var(--border-light)', borderRadius: '8px', marginBottom: '16px' }}>
                  <span className="label-sm">Xizmat yoki Tarmoq nomi (Masalan Meta Ads):</span>
                  <input className="input-base" value={newHookForm.name} onChange={e=>setNewHookForm({...newHookForm, name:e.target.value})} />
                  <span className="label-sm">API Token / Webhook URL:</span>
                  <input className="input-base" value={newHookForm.token} onChange={e=>setNewHookForm({...newHookForm, token:e.target.value})} />
                  <button className="btn-success" onClick={addHook}>Ulashing</button>
               </div>

               {hooks.length > 0 && (
                  <div>
                     <span className="label-sm" style={{marginBottom: '12px'}}>Uning ulangan tarmog'lar:</span>
                     <div style={{display:'flex', flexDirection:'column', gap:'8px'}}>
                        {hooks.map(h => (
                           <div key={h.id} style={{padding:'12px', background:'var(--bg-base)', border:'1px solid var(--border-light)', borderRadius:'6px', display:'flex', justifyContent:'space-between'}}>
                              <div><strong>{h.name}</strong> <div style={{fontSize:'11px', color:'var(--text-muted)'}}>{h.token}</div></div>
                              <button className="btn-outline" onClick={()=>setHooks(hooks.filter(x=>x.id!==h.id))}>Uziw</button>
                           </div>
                        ))}
                     </div>
                  </div>
               )}
            </div>
         </div>
       )
    }

    const App = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const isFormMode = urlParams.get('leadForm') === 'true';
      const formPipeId = urlParams.get('pipe');

      const [users, setUsers] = useState([
         { username: 'ceo', password: '123', role: 'CEO' },
         { username: 'menejer_1', password: '123', role: 'MANAGER' }
      ]);
      // Sessiyani localStorage'dan tiklash (refresh'dan keyin qayta kirmaslik uchun)
      const [authUser, setAuthUser] = useState(() => {
         try {
           const saved = localStorage.getItem('mizon_session');
           return saved ? JSON.parse(saved) : null;
         } catch(e) { return null; }
      });

      const [darkMode, setDarkMode] = useState(() => {
         const saved = localStorage.getItem('mizon_theme');
         return saved ? saved === 'dark' : true;
      });

      useEffect(() => {
         document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
         localStorage.setItem('mizon_theme', darkMode ? 'dark' : 'light');
      }, [darkMode]);
      
      const [loginForm, setLoginForm] = useState({username: '', password: ''});
      const [activeTab, setActiveTab] = useState('dashboard');
      const [settingsActiveTab, setSettingsActiveTab] = useState('users');

      const [pipelines, setPipelines] = useState(() => {
         const saved = localStorage.getItem('mizon_pipelines');
         return saved ? JSON.parse(saved) : initialPipelines;
      });
      const [columnsMap, setColumnsMap] = useState(() => {
         const saved = localStorage.getItem('mizon_columnsMap');
         return saved ? JSON.parse(saved) : initialColumns;
      });
      const [leads, setLeads] = useState(() => {
         const saved = localStorage.getItem('mizon_leads');
         if(saved) {
            try { const parsed = JSON.parse(saved); if(parsed.length > 0) return parsed; } catch(e) {}
         }
         return initialLeads;
      });

      // Stage ID mapping: DB uses numbers (1,2,3...), frontend uses strings (NEW, CONTACTED...)
      const stageIdToFrontend = { 1: 'NEW', 2: 'CONTACTED', 3: 'QUALIFIED', 4: 'PROPOSAL', 5: 'NEGOTIATION', 6: 'WON', 7: 'LOST' };
      const frontendToStageId = { 'NEW': 1, 'CONTACTED': 2, 'QUALIFIED': 3, 'PROPOSAL': 4, 'NEGOTIATION': 5, 'WON': 6, 'LOST': 7, 'MEETING': 2, 'CONTRACT': 3 };

      useEffect(() => {
         fetch('/api/leads').then(res => {
            if(!res.ok) throw new Error('API mavjud emas');
            return res.json();
         }).then(data => {
            if(data.success && data.leads && data.leads.length > 0) {
               setLeads(data.leads.map(l => ({
                   id: l.id,
                   pipelineId: l.pipelineid || 'p1',
                   name: l.name,
                   owner: l.owner || 'ceo',
                   phone: l.phone,
                   region: l.region || 'Toshkent',
                   source: l.mizon_source || 'manual',
                   status: stageIdToFrontend[l.stage_id] || 'NEW',
                   actualCallAttempts: l.actualcallattempts || 0,
                   deadline: l.deadline || null,
                   taskDescription: l.taskdescription || null,
                   chatLogs: typeof l.chatlogs === 'string' ? JSON.parse(l.chatlogs) : (l.chatlogs || [{type: 'sys', date: l.created_at, text: "Tizimga qo'shildi"}])
               })));
            }
         }).catch(err => {
             console.log('Offline/Demo rejim faol.', err.message);
         });
      }, []);
      const [globalCallLimit, setGlobalCallLimit] = useState(5);

      useEffect(() => { localStorage.setItem('mizon_pipelines', JSON.stringify(pipelines)); }, [pipelines]);
      useEffect(() => { localStorage.setItem('mizon_columnsMap', JSON.stringify(columnsMap)); }, [columnsMap]);
      useEffect(() => { localStorage.setItem('mizon_leads', JSON.stringify(leads)); }, [leads]);

      const [activePipe, setActivePipe] = useState(pipelines[0]?.id || null);
      const [selectedLeadId, setSelectedLeadId] = useState(null);

      // Panel & Chat State
      const [taskDescInput, setTaskDescInput] = useState('');
      const [taskDateInput, setTaskDateInput] = useState('');
      const [showCompleteModal, setShowCompleteModal] = useState(false);
      const [taskCompleteNote, setTaskCompleteNote] = useState('');
      const [chatMessageInput, setChatMessageInput] = useState('');

      // Add Lead State
      const [showAddLead, setShowAddLead] = useState(false);
      const [newLeadForm, setNewLeadForm] = useState({name:'', phone:'', region:''});

      // Custom Form Fields (CEO creates these)
      const [formFields, setFormFields] = useState(() => {
         const saved = localStorage.getItem('mizon_formFields');
         return saved ? JSON.parse(saved) : [
            { id: 'f1', label: 'Ism va Familiya', key: 'name', type: 'text', required: true, placeholder: 'Abdulla Qodiriy...' },
            { id: 'f2', label: 'Telefon raqam', key: 'phone', type: 'tel', required: true, placeholder: '+998 90 123 45 67' },
            { id: 'f3', label: 'Manzil', key: 'region', type: 'text', required: false, placeholder: 'Toshkent shahri...' },
         ];
      });
      useEffect(() => { localStorage.setItem('mizon_formFields', JSON.stringify(formFields)); }, [formFields]);

      // Editable lead fields state
      const [editingLead, setEditingLead] = useState(false);

      if (isFormMode) {
         const [extFormData, setExtFormData] = useState({});
         return (
            <div className="login-overlay">
               <form className="login-box" style={{maxWidth: '440px'}} onSubmit={(e) => {
                  e.preventDefault();
                  const nameField = formFields.find(f => f.key === 'name');
                  const phoneField = formFields.find(f => f.key === 'phone');
                  if(nameField && nameField.required && !extFormData.name) return alert("Ismingizni kiriting!");
                  if(phoneField && phoneField.required && !extFormData.phone) return alert("Telefon raqamni kiriting!");
                  const cols = columnsMap[formPipeId] || [];
                  const initialStage = cols[0] ? cols[0].id : 'NEW';
                  const extraInfo = formFields.filter(f => !['name','phone','region'].includes(f.key)).map(f => `${f.label}: ${extFormData[f.key] || '-'}`).join(' | ');
                  setLeads([...leads, {
                      id: 'EXT_' + Date.now(), pipelineId: formPipeId || pipelines[0]?.id, 
                      name: extFormData.name || 'Noma\'lum', phone: extFormData.phone || '', region: extFormData.region || 'Veb-Sayt Form',
                      source: 'website', owner: 'Navbatda', status: initialStage, actualCallAttempts: 0, deadline: null, taskDescription: null,
                      chatLogs: [
                        {type: 'sys', date: new Date().toISOString(), text: "Mijoz tashqi havoladan ro'yxatdan o'tdi."},
                        ...(extraInfo ? [{type: 'sys', date: new Date().toISOString(), text: "Forma ma'lumotlari: " + extraInfo}] : [])
                      ]
                  }]);
                  alert("Arizangiz muvaffaqiyatli qabul qilindi! Tez orada aloqaga chiqamiz.");
                  setExtFormData({});
               }}>
                 <h2 style={{ fontSize: '24px', marginBottom: '8px', fontWeight: 800, textAlign:'center' }}>Ro'yxatdan o'tish</h2>
                 <p style={{ color: 'var(--text-muted)', marginBottom: '24px', fontSize: '13px', textAlign:'center' }}>Kompaniyamiz bilan bog'lanish uchun ma'lumotlaringizni qoldiring.</p>
                 
                 {formFields.map(f => (
                    <div key={f.id}>
                       <span className="label-sm">{f.label}{f.required ? ' *' : ''}</span>
                       <input className="input-base" type={f.type || 'text'} placeholder={f.placeholder || ''} 
                          value={extFormData[f.key] || ''} 
                          onChange={e => setExtFormData({...extFormData, [f.key]: e.target.value})} />
                    </div>
                 ))}
                 
                 <button className="btn-primary" style={{ width: '100%', marginTop: '16px', padding: '12px' }} type="submit">Arizani Jo'natish</button>
               </form>
            </div>
         );
      }

      const [, setTick] = useState(0);
      useEffect(() => { const iv = setInterval(()=>setTick(t=>t+1), 60000); return ()=>clearInterval(iv); }, []);

      const [hasUnsavedChanges, setHasUnsavedChanges] = useState(false);

      useEffect(() => {
         const handleKeyDown = (e) => {
            if (e.key === 'Enter' && selectedLeadId) {
               if (e.target.id === 'chatMessageInputBox') return;
               if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                  setSelectedLeadId(null);
                  setShowCompleteModal(false);
                  setHasUnsavedChanges(false);
               }
            }
         };
         window.addEventListener('keydown', handleKeyDown);
         return () => window.removeEventListener('keydown', handleKeyDown);
      }, [selectedLeadId]);

      const handleLogin = (e) => {
         e.preventDefault();
         const match = users.find(u => u.username === loginForm.username && u.password === loginForm.password);
         if(match) {
           setAuthUser(match);
           localStorage.setItem('mizon_session', JSON.stringify(match));
           setActiveTab('dashboard');
         } else { alert("Login yoki parol nato'g'ri!"); }
      };

      if (!authUser) {
        return (
          <div className="login-overlay">
            <form onSubmit={handleLogin} className="login-box">
              <h1 style={{ fontSize: '36px', marginBottom: '8px', fontWeight: 800, letterSpacing: '-1px' }}>MIZON.</h1>
              <p style={{ color: 'var(--text-muted)', marginBottom: '32px', fontSize: '13px' }}>Tizimga kirish uchun xodim ruxsatnomasini kiriting.</p>
              <input className="input-base" placeholder="Login (ceo yoki menejer_1)" value={loginForm.username} onChange={e=>setLoginForm({...loginForm, username: e.target.value})} />
              <input className="input-base" type="password" placeholder="Parol (123)" value={loginForm.password} onChange={e=>setLoginForm({...loginForm, password: e.target.value})} />
              <button className="btn-primary" style={{ width: '100%', marginTop: '16px', padding: '12px' }} type="submit">Tizimga Kirish</button>
            </form>
          </div>
        )
      }

      const role = authUser.role;



      const activeColumns = columnsMap[activePipe] || [];
      const activeLeads = leads.filter(l => l.pipelineId === activePipe);
      const selectedLeadData = leads.find(l => l.id == selectedLeadId);

      const syncLeadToAPI = (lead) => {
         if(String(lead.id).startsWith('L_') || String(lead.id).startsWith('EXT_')) return;
         fetch('/api/leads/' + lead.id, {
            method: 'PUT',
             headers: {'Content-Type': 'application/json'},
             body: JSON.stringify({
                 status: frontendToStageId[lead.status] || lead.status, 
                 name: lead.name,
                 phone: lead.phone,
                 region: lead.region,
                 source: lead.source,
                 actualCallAttempts: lead.actualCallAttempts,
                 deadline: lead.deadline,
                 taskDescription: lead.taskDescription,
                 chatLogs: lead.chatLogs,
                 owner: lead.owner
             })
         }).catch(err => console.log('Sinxronlashda xato', err));
      };

      const handleAddManualLead = () => {
         if(!newLeadForm.name || !newLeadForm.phone) return alert("Ism va Raqamni kiriting");
         const cols = columnsMap[activePipe];
         if(!cols || cols.length === 0) return alert("Avval quvurga bosqich qo'shing");
         const initialStage = cols[0].id;
         const localLead = {
            id: 'L_' + Date.now(), pipelineId: activePipe, name: newLeadForm.name, phone: newLeadForm.phone, region: newLeadForm.region || "Shahar noma'lum",
            source: 'manual', owner: authUser.username, status: initialStage, actualCallAttempts: 0, deadline: null, taskDescription: null,
            chatLogs: [{type: 'sys', date: new Date().toISOString(), text: `Menejer (${authUser.username}) qo'lda kiritdi. Status: ${cols[0].title}`}]
         };

         // Try API first, fallback to local
         fetch('/api/leads', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name: newLeadForm.name, phone: newLeadForm.phone, region: newLeadForm.region, owner: authUser.username, pipelineId: activePipe, status: frontendToStageId[initialStage] || 1 })
         }).then(res => res.json()).then(data => {
            if(data.success) { localLead.id = data.lead.id; }
            setLeads(prev => [...prev, localLead]);
            setShowAddLead(false);
            setNewLeadForm({name:'', phone:'', region:''});
         }).catch(() => {
            setLeads(prev => [...prev, localLead]);
            setShowAddLead(false);
            setNewLeadForm({name:'', phone:'', region:''});
         });
      };

      const handleTaskCreate = (id) => {
         if(!taskDateInput) return alert("Sana va vaqt kiritilishi shart!");
         let targetLead = null;
         setLeads(prev => prev.map(l => {
            if(l.id == id) {
                targetLead = { ...l, deadline: taskDateInput, taskDescription: taskDescInput || 'Izohsiz vazifa', chatLogs: [...l.chatLogs, {type:'sys', date: new Date().toISOString(), text:`Vazifa ochildi: "${taskDescInput || 'Izohsiz vazifa'}" -> ${new Date(taskDateInput).toLocaleString()}`}] };
                return targetLead;
            } return l;
         }));
         setTaskDateInput(''); setTaskDescInput('');
         setHasUnsavedChanges(true);
         if (targetLead) setTimeout(() => syncLeadToAPI(targetLead), 100);
      };

      const handleTaskComplete = (id) => {
         let targetLead = null;
         setLeads(prev => prev.map(l => {
            if(l.id == id) {
                targetLead = { ...l, deadline: null, taskDescription: null, chatLogs: [...l.chatLogs, {type:'sys', date: new Date().toISOString(), text:`✅ Vazifa yakunlandi! Natija/Izoh: "${taskCompleteNote || 'Izohsiz bajardi'}"`}] };
                return targetLead;
            } return l;
         }));
         setShowCompleteModal(false);
         setTaskCompleteNote('');
         setHasUnsavedChanges(true);
         if (targetLead) setTimeout(() => syncLeadToAPI(targetLead), 100);
      }

      const handleLogCall = (id) => {
         setHasUnsavedChanges(true);
         let targetLead = null;
         setLeads(prev => prev.map(l => {
           if(l.id == id) {
              const a = l.actualCallAttempts + 1;
              if (a >= globalCallLimit) {
                 targetLead = { ...l, actualCallAttempts: a, status: 'LOST', chatLogs: [...l.chatLogs, {type:'sys', date: new Date().toISOString(), text:`⛔ DIQQAT: Limit tugadi (${globalCallLimit} ta urinish). Lead asossiz tarzda Muvaffaqiyatsiz (LOST) deb hisoblandi.`}] };
                 return targetLead;
              }
              targetLead = {...l, actualCallAttempts: a, chatLogs: [...l.chatLogs, {type:'sys', date: new Date().toISOString(), text:`📞 IP Telephoniya orqali qo'ng'iroq qilindi (Qo'ng'iroq #${a} / Limit ${globalCallLimit})`}]};
              return targetLead;
           } return l;
         }));
         if (targetLead) setTimeout(() => syncLeadToAPI(targetLead), 100);
      };

      const handleStatusChange = (leadId, newStatus) => {
         setHasUnsavedChanges(true);
         let targetLead = null;
         setLeads(prev => prev.map(l => {
            if(l.id == leadId) {
                targetLead = { ...l, status: newStatus, actualCallAttempts: 0, chatLogs: [...l.chatLogs, {type:'sys', date: new Date().toISOString(), text:`Kanban orqali bosqich uzgardi -> ${newStatus}. Urinishlar limit nollashtirildi.`}] };
                return targetLead;
            } return l;
         }));
         if (targetLead) setTimeout(() => syncLeadToAPI(targetLead), 100);
      };

      const handleSendChatMsg = (id) => {
         if(!chatMessageInput.trim()) return;
         setHasUnsavedChanges(true);
         let targetLead = null;
         setLeads(prev => prev.map(l => {
            if(String(l.id) === String(id)) {
                targetLead = { ...l, chatLogs: [...l.chatLogs, {type:'msg', dir:'out', date: new Date().toISOString(), text: chatMessageInput}] };
                return targetLead;
            } return l;
         }));
         setChatMessageInput('');
         if (targetLead) setTimeout(() => syncLeadToAPI(targetLead), 100);
      }

      const handleDragStart = (e, leadId) => { e.dataTransfer.setData('leadId', String(leadId)); };
      const handleDrop = (e, targetStatus) => { e.preventDefault(); const leadId = e.dataTransfer.getData('leadId'); if(leadId) handleStatusChange(leadId, targetStatus); };

      return (
        <div className="app-container">
          <aside className="sidebar">
            <div className="brand">MIZON. <span style={{fontSize: '11px', background:'var(--border-light)', padding: '4px 8px', borderRadius: '12px'}}>{role}</span></div>
            
            <div className={`nav-item ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => {setActiveTab('dashboard'); setSelectedLeadId(null);}} style={{display:"flex",alignItems:"center",gap:"8px"}}><Ico n="chart" s={14}/> Tahlil (Dashboard)</div>
            <div className={`nav-item ${activeTab === 'leads' ? 'active' : ''}`} onClick={() => {setActiveTab('leads'); setSelectedLeadId(null);}} style={{display:"flex",alignItems:"center",gap:"8px"}}><Ico n="funnel" s={14}/> Sotuv Varonkasi</div>
            
            {role === 'CEO' && (
              <div className={`nav-item ${activeTab === 'integrations' ? 'active' : ''}`} onClick={() => {setActiveTab('integrations'); setSelectedLeadId(null);}}>Integratsiyalar <span style={{fontSize:'8px', background:'var(--danger)', color:'#fff', padding:'2px 4px', borderRadius:'4px'}}>YANGI</span></div>
            )}
            {role === 'CEO' && (
              <div className={`nav-item ${activeTab === 'settings' ? 'active' : ''}`} onClick={() => {setActiveTab('settings'); setSelectedLeadId(null);}} style={{display:"flex",alignItems:"center",gap:"8px"}}><Ico n="settings" s={14}/> Sozlamalar paneli</div>
            )}

            <div style={{marginTop: 'auto', borderTop: '1px solid var(--border-light)', paddingTop: '16px'}}>
              <div style={{color: 'var(--text-muted)', fontSize: '11px', marginBottom: '8px', paddingLeft: '12px'}}>Mas'ul xodim: {authUser.username}</div>
              <div className="nav-item" style={{display:'flex',alignItems:'center',gap:'8px'}} onClick={() => { setAuthUser(null); localStorage.removeItem('mizon_session'); }}><Ico n="door" s={14}/> Tizimdan chiqish</div>
            </div>
          </aside>
          
          <main className="main-wrapper">
            <header className="topbar">
               <div style={{color: 'var(--text-muted)', fontSize:'12px'}}></div>
               <button className="theme-toggle" onClick={() => setDarkMode(!darkMode)} title={darkMode ? 'Kunduzgi rejim' : 'Tungi rejim'}>
                   {darkMode ? <Ico n="sun" s={18}/> : <Ico n="moon" s={18}/>}
               </button>
            </header>

            <div className="content-area" style={{position: 'relative'}}>
               
               {/* OVERLAYS & VIEWS */}
               {selectedLeadId && selectedLeadData ? (
                 <div className="lead-panel-overlay">
                    <div className="lead-panel-header">
                       <div><div style={{fontSize: '12px', color: 'var(--text-muted)'}}>KARTA ID: {selectedLeadData.id} • MAS'UL: <b>{selectedLeadData.owner}</b></div><div style={{fontSize: '20px', fontWeight: 600}}>{selectedLeadData.name}</div></div>
                       {hasUnsavedChanges ? (
                          <button className="btn-success" onClick={() => {setSelectedLeadId(null); setShowCompleteModal(false); setHasUnsavedChanges(false);}}><Ico n="save" s={14}/> O'zgarishlarni Saqlash</button>
                       ) : (
                          <button className="btn-outline" onClick={() => {setSelectedLeadId(null); setShowCompleteModal(false);}}><Ico n="x" s={14}/> Yopish</button>
                       )}
                    </div>
                    <div className="lead-panel-body">
                       <div className="lead-profile-col">
                          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'8px'}}>
                             <span className="label-sm" style={{marginBottom:0}}>Mijoz axborotlari</span>
                             <button className="btn-outline" style={{padding:'4px 10px', fontSize:'11px'}} onClick={() => setEditingLead(!editingLead)}>{editingLead ? <><Ico n="check" s={12}/> Saqlash</> : <><Ico n="pencil" s={12}/> Tahrirlash</>}</button>
                          </div>
                          {editingLead ? (
                             <div style={{ display: 'flex', flexDirection: 'column', gap: '6px', marginBottom: '24px' }}>
                                <span className="label-sm">Ism:</span>
                                <input className="input-base" value={selectedLeadData.name} onChange={e => { setHasUnsavedChanges(true); setLeads(prev => prev.map(l => l.id == selectedLeadId ? {...l, name: e.target.value} : l)); }} />
                                <span className="label-sm">Telefon:</span>
                                <input className="input-base" value={selectedLeadData.phone} onChange={e => { setHasUnsavedChanges(true); setLeads(prev => prev.map(l => l.id == selectedLeadId ? {...l, phone: e.target.value} : l)); }} />
                                <span className="label-sm">Manzil:</span>
                                <input className="input-base" value={selectedLeadData.region} onChange={e => { setHasUnsavedChanges(true); setLeads(prev => prev.map(l => l.id == selectedLeadId ? {...l, region: e.target.value} : l)); }} />
                                <span className="label-sm">Manba (kanal):</span>
                                <select className="input-base" value={selectedLeadData.source} onChange={e => { setHasUnsavedChanges(true); setLeads(prev => prev.map(l => l.id == selectedLeadId ? {...l, source: e.target.value} : l)); }}>
                                   <option value="meta_fb_ads">Facebook Lead Ads</option>
                                   <option value="telegram_bot">Telegram Bot</option>
                                   <option value="phone_call">Telefon</option>
                                   <option value="referral">Tavsiya (Referral)</option>
                                   <option value="website">Veb-sayt</option>
                                   <option value="manual">Qo'lda kiritilgan</option>
                                </select>
                                <span className="label-sm">Mas'ul xodim:</span>
                                <select className="input-base" value={selectedLeadData.owner} onChange={e => { setHasUnsavedChanges(true); setLeads(prev => prev.map(l => l.id == selectedLeadId ? {...l, owner: e.target.value} : l)); }}>
                                   {users.map(u => <option key={u.username} value={u.username}>{u.username} ({u.role})</option>)}
                                </select>
                             </div>
                          ) : (
                             <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', marginBottom: '24px' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '13px' }}><span style={{color: 'var(--text-muted)'}}>Telefon:</span><span>{selectedLeadData.phone}</span></div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '13px' }}><span style={{color: 'var(--text-muted)'}}>Manzil:</span><span>{selectedLeadData.region}</span></div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '13px' }}><span style={{color: 'var(--text-muted)'}}>Kanal:</span><span className={`source-badge badge-${selectedLeadData.source}`}>{selectedLeadData.source}</span></div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '13px' }}><span style={{color: 'var(--text-muted)'}}>Mas'ul:</span><span style={{fontWeight:600}}>{selectedLeadData.owner}</span></div>
                             </div>
                          )}

                          <span className="label-sm">SLA qat'iy nazorati va Vazifa Oqimi</span>
                          
                          {selectedLeadData.deadline ? (
                             <div style={{ padding: '16px', borderRadius: 'var(--radius-sm)', marginBottom: '24px', 
                               background: determineSLAType(selectedLeadData.deadline)==='danger'?'var(--danger-bg)':determineSLAType(selectedLeadData.deadline)==='warning'?'var(--warning-bg)':'var(--bg-base)',
                               border: `1px solid ${determineSLAType(selectedLeadData.deadline)==='danger'?'var(--danger)':determineSLAType(selectedLeadData.deadline)==='warning'?'#fff':'var(--border-light)'}`
                             }}>
                               <div style={{ fontSize: '11px', textTransform: 'uppercase', color: 'rgba(255,255,255,0.7)', marginBottom:'4px'}}>Vazifa Muddat Taymeri:</div>
                               <div style={{ fontSize: '14px', fontWeight: 600, color: '#fff', marginBottom:'12px'}}>
                                  <Ico n="clock" s={14}/> {new Date(selectedLeadData.deadline).toLocaleString()}
                               </div>
                               
                               {!showCompleteModal ? (
                                  <button className="btn-success" style={{width: '100%', marginTop: '12px'}} onClick={()=>setShowCompleteModal(true)}>
                                    <Ico n="check" s={14}/> Vazifani tugatish
                                  </button>
                               ) : (
                                  <div style={{ marginTop: '12px', padding: '12px', background: 'rgba(0,0,0,0.5)', borderRadius: '6px' }}>
                                     <span className="label-sm">Tugatish sababi (ijro xulosasi):</span>
                                     <input className="input-base" placeholder="Natija: Shartnoma imzolandi..." value={taskCompleteNote} onChange={e=>setTaskCompleteNote(e.target.value)} />
                                     <div style={{display: 'flex', gap: '8px'}}>
                                        <button className="btn-success" style={{flex: 1}} onClick={()=>handleTaskComplete(selectedLeadData.id)}>Tasdiqlash</button>
                                        <button className="btn-outline" style={{padding: '0 8px'}} onClick={()=>setShowCompleteModal(false)}>X</button>
                                     </div>
                                  </div>
                               )}
                             </div>
                          ) : (
                             <div style={{ padding: '16px', borderRadius: 'var(--radius-sm)', marginBottom: '24px', background: 'var(--bg-hover)', border: '1px solid var(--border-light)' }}>
                               <div style={{ fontSize: '13px', color: 'var(--danger)', fontWeight: 600, marginBottom: '12px' }}><Ico n="alert" s={14}/> Hozirda vazifa biriktirilmagan!</div>
                               <input className="input-base" type="text" placeholder="Vazifa haqida izoh kiritish (matn)..." value={taskDescInput} onChange={e=>setTaskDescInput(e.target.value)} />
                               <input type="datetime-local" className="input-base" value={taskDateInput} onChange={e=>setTaskDateInput(e.target.value)} />
                               <button className="btn-primary" style={{width: '100%'}} onClick={()=>{handleTaskCreate(selectedLeadData.id)}}>Vazifani o'rnatish</button>
                             </div>
                          )}

                          <span className="label-sm">Muloqot harakati</span>
                          <button className="btn-outline" style={{width: '100%', marginBottom: '24px', position:'relative', zIndex:5}} onClick={()=>handleLogCall(selectedLeadData.id)}>
                            <Ico n="phone" s={14}/> Qo'ng'iroq Start ({selectedLeadData.actualCallAttempts} / {globalCallLimit})
                          </button>

                          <span className="label-sm">Holatni / Bosqichni Qo'lda o'zgartirish</span>
                          <select className="input-base" value={selectedLeadData.status} onChange={e=>handleStatusChange(selectedLeadData.id, e.target.value)}>
                             {columnsMap[selectedLeadData.pipelineId]?.map((c) => <option key={c.id} value={c.id}>{c.title}</option>)}
                          </select>
                       </div>

                       <div className="lead-chat-col">
                          {/* Kim ishlayapti — faol foydalanuvchi ko'rsatkichi */}
                          <div style={{
                            padding: '8px 24px',
                            background: 'rgba(59,130,246,0.08)',
                            borderBottom: '1px solid rgba(59,130,246,0.2)',
                            display: 'flex',
                            alignItems: 'center',
                            gap: '8px',
                            fontSize: '12px'
                          }}>
                            <span style={{
                              width: '8px', height: '8px',
                              borderRadius: '50%',
                              background: '#22c55e',
                              display: 'inline-block',
                              boxShadow: '0 0 6px #22c55e'
                            }}></span>
                            <span style={{color: 'var(--text-secondary)'}}>
                              <b style={{color: 'var(--accent)'}}>{authUser.username}</b> hozir bu oynada ishlayapti
                            </span>
                            {selectedLeadData.owner !== authUser.username && (
                              <span style={{
                                marginLeft: 'auto',
                                background: 'rgba(245,158,11,0.15)',
                                border: '1px solid rgba(245,158,11,0.4)',
                                color: '#f59e0b',
                                padding: '2px 8px',
                                borderRadius: '10px',
                                fontSize: '11px'
                              }}><Ico n="alert" s={10}/> Mas'ul: {selectedLeadData.owner}</span>
                            )}
                          </div>
                          {selectedLeadData.deadline && selectedLeadData.taskDescription && (
                             <div className="lead-pinned-task">
                                <strong><Ico n="pin" s={13}/> Faol Vazifa:</strong>
                                <span>{selectedLeadData.taskDescription}</span>
                             </div>
                          )}
                          <div className="chat-logs-area">
                             {selectedLeadData.chatLogs.map((log, idx) => {
                                if(log.type === 'sys') return <div key={idx} className="sys-log">{new Date(log.date).toLocaleTimeString()} — <b>{log.text}</b></div>;
                                return <div key={idx} className={`msg-bubble ${log.dir==='in'?'msg-in':'msg-out'}`}>{log.text}</div>;
                             })}
                          </div>
                          <div className="chat-input-area">
                             <input id="chatMessageInputBox" className="input-base" style={{marginBottom: 0}} placeholder="Chatga maxsus izoh, qayd yoki sharh yozib qoldirish..." value={chatMessageInput} onChange={e=>setChatMessageInput(e.target.value)} onKeyDown={e=>{if(e.key === 'Enter') handleSendChatMsg(selectedLeadData.id)}} />
                             <button className="btn-primary" onClick={()=>handleSendChatMsg(selectedLeadData.id)}>Yuborish</button>
                          </div>
                      </div>
                    </div>
                 </div>
               ) : null}

               {/* ADD MANUAL LEAD MODAL */}
               {showAddLead && (
                 <div className="login-overlay" onClick={(e) => { if(e.target === e.currentTarget) setShowAddLead(false); }}>
                    <div className="login-box" style={{width: '440px'}} onKeyDown={(e) => { if(e.key === 'Enter' && newLeadForm.name && newLeadForm.phone) { e.preventDefault(); handleAddManualLead(); } }}>
                       <h2 style={{marginBottom: '24px', letterSpacing: '-0.5px'}}>+ Yangi Lead Yaratish</h2>
                       <div style={{display: 'flex', flexDirection: 'column', gap: '8px', textAlign: 'left'}}>
                          <span className="label-sm">Mijozning ism-familiyasi*</span>
                          <input className="input-base" autoFocus placeholder="Masalan: Sardor Odilov" value={newLeadForm.name} onChange={e=>setNewLeadForm({...newLeadForm, name: e.target.value})} />
                          <span className="label-sm">Telefon raqami*</span>
                          <input className="input-base" placeholder="+998 XX XXX XX XX" value={newLeadForm.phone} onChange={e=>setNewLeadForm({...newLeadForm, phone: e.target.value})} />
                          <span className="label-sm">Manzili yoki shahar</span>
                          <input className="input-base" placeholder="Toshkent, Yunusobod..." value={newLeadForm.region} onChange={e=>setNewLeadForm({...newLeadForm, region: e.target.value})} />
                       </div>
                       <p style={{fontSize:'11px', color:'var(--text-muted)', marginTop:'12px'}}><Ico n="bulb" s={12}/> Ism va raqam to'ldirilgandan so'ng <b>Enter</b> bosing yoki tugmani bosing.</p>
                       <div style={{display: 'flex', gap: '12px', marginTop: '16px'}}>
                         <button className="btn-primary" style={{flex: 1}} onClick={handleAddManualLead}>Tasdiqlash va Qo'shish</button>
                         <button className="btn-outline" onClick={()=>setShowAddLead(false)}>Bekor qilish</button>
                       </div>
                    </div>
                 </div>
               )}

               {/* TAB ROUTING */}
               {activeTab === 'dashboard' && <DashboardOverview leads={leads} role={role} setSelectedLeadId={setSelectedLeadId} />}
               
               {activeTab === 'integrations' && <IntegrationsModule />}

               {activeTab === 'leads' && (
                 <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
                   <div className="pipeline-header">
                     <h2 style={{ fontSize: '20px', letterSpacing: '-0.5px' }}>Sotuv Varonkasi (Kanban)</h2>
                     <div style={{ display: 'flex', gap: '16px', alignItems: 'center' }}>
                       <select className="pipeline-selector" value={activePipe} onChange={e => setActivePipe(e.target.value)}>
                          {pipelines.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                       </select>
                       <button className="btn-primary" onClick={()=>setShowAddLead(true)}>+ Yangi Lead qo'shish</button>
                     </div>
                   </div>
                   
                   <div className="kanban-board">
                     {activeColumns.map((col) => {
                       const colLeads = activeLeads.filter(l => l.status === col.id);
                       return (
                         <div key={col.id} className="kanban-col" onDragOver={(e) => e.preventDefault()} onDrop={(e) => handleDrop(e, col.id)}>
                           <div className="kanban-col-header">
                             <span>{col.title}</span><span className="kanban-col-count">{colLeads.length}</span>
                           </div>
                           <div className="kanban-cards">
                             {colLeads.map(lead => {
                               const sla = determineSLAType(lead.deadline);
                               let customClass = '';
                               const hasTask = lead.deadline || lead.taskDescription;
                               if(sla === 'danger') customClass = 'status-danger';
                               else if(sla === 'warning') customClass = 'status-warning';
                               else if(!hasTask && !['NEW', 'LOST', 'WON'].includes(lead.status)) customClass = 'needs-attention';

                               return (
                                 <div 
                                    className={`k-card ${customClass}`} 
                                    key={lead.id} 
                                    draggable={true} 
                                    onDragStart={(e) => handleDragStart(e, lead.id)}
                                    onClick={() => setSelectedLeadId(lead.id)}
                                    style={customClass === 'needs-attention' ? { borderLeft: '4px solid var(--danger)' } : {}}
                                 >
                                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px', alignItems: 'center' }}>
                                      <span className={`source-badge badge-${lead.source}`}>{lead.source.replace('meta_', '')}</span>
                                      {sla === 'danger' && <span style={{fontSize: '10px', background: 'rgba(239, 68, 68, 0.2)', color: 'var(--danger)', padding: '2px 6px', borderRadius: '4px', fontWeight: 'bold'}}><Ico n="alarm" s={10}/> KECHIKDI</span>}
                                      {sla === 'warning' && <span style={{fontSize: '10px', background: 'rgba(234, 179, 8, 0.2)', color: 'var(--warning)', padding: '2px 6px', borderRadius: '4px', fontWeight: 'bold'}}><Ico n="clock" s={10}/> TEZ ORADA</span>}
                                    </div>
                                    <div style={{ fontWeight: 600, fontSize: '15px', color: 'var(--text-main)', marginBottom: '4px' }}>{lead.name}</div>
                                    <div className="text-muted" style={{ fontSize: '12px', marginBottom: '8px' }}>
                                       <Ico n="phone" s={11}/> {lead.actualCallAttempts} urinish • <Ico n="user" s={11}/> <b>{lead.owner}</b>
                                    </div>
                                    
                                    {(lead.taskDescription || lead.deadline) ? (
                                       <div style={{ fontSize: '11px', background: 'rgba(255,255,255,0.05)', padding: '6px', borderRadius: '4px', border: '1px solid rgba(255,255,255,0.1)' }}>
                                          {lead.taskDescription ? (
                                             <span><Ico n="message" s={11}/> {lead.taskDescription.substring(0,30)}...</span>
                                          ) : (
                                             <span style={{color:'var(--text-muted)'}}><Ico n="clock" s={11}/> Muddat belgilangan (vazifa matni yo'q)</span>
                                          )}
                                       </div>
                                    ) : (
                                       !['NEW', 'LOST', 'WON'].includes(lead.status) && (
                                          <div style={{ fontSize: '11px', background: 'rgba(239, 68, 68, 0.1)', color: 'var(--danger)', padding: '6px', borderRadius: '4px', border: '1px solid var(--danger)', fontWeight: 600 }}>
                                             <Ico n="alert" s={11}/> DIQQAT: VAZIFA BELGILANMAGAN!
                                          </div>
                                       )
                                    )}
                                 </div>
                               )
                             })}
                           </div>
                         </div>
                       )
                     })}
                   </div>
                 </div>
               )}

               {activeTab === 'settings' && role === 'CEO' && (
                 <div style={{ maxWidth: '800px', margin: '0 auto' }}>
                    <div className="settings-tab-bar">
                       <div className={`settings-tab ${settingsActiveTab==='users'?'active':''}`} onClick={()=>setSettingsActiveTab('users')}><Ico n="users" s={14}/> Xodimlar</div>
                       <div className={`settings-tab ${settingsActiveTab==='limits'?'active':''}`} onClick={()=>setSettingsActiveTab('limits')}><Ico n="settings" s={14}/> Sozlamalar</div>
                       <div className={`settings-tab ${settingsActiveTab==='pipelines'?'active':''}`} onClick={()=>setSettingsActiveTab('pipelines')}><Ico n="layers" s={14}/> Varonkalar</div>
                       <div className={`settings-tab ${settingsActiveTab==='webforms'?'active':''}`} onClick={()=>setSettingsActiveTab('webforms')}><Ico n="file" s={14}/> Veb Shakl</div>
                    </div>
                    <div className="card" style={{minHeight: '400px'}}>
                       {settingsActiveTab === 'users' && (
                          <div><h3 style={{marginBottom: '16px'}}>Tizimda bor Raxbarlar va Sotuvchilar</h3><UserManagement users={users} setUsers={setUsers} /></div>
                       )}
                       {settingsActiveTab === 'limits' && (
                          <div><h3 style={{marginBottom: '16px'}}>Kompaniyaning Global Ko'rsatkichlari</h3><GlobalLimitsConfig globalCallLimit={globalCallLimit} setGlobalCallLimit={setGlobalCallLimit} /></div>
                       )}
                       {settingsActiveTab === 'pipelines' && (
                          <div><h3 style={{marginBottom: '16px'}}>Sotuv Varonkalarini Sozlash</h3><PipelineEditor pipelines={pipelines} setPipelines={setPipelines} columnsMap={columnsMap} setColumnsMap={setColumnsMap} /></div>
                       )}
                       {settingsActiveTab === 'webforms' && (
                          <div>
                             <h3 style={{marginBottom: '16px'}}>Forma Konstruktori (Form Builder)</h3>
                             <p style={{fontSize: '13px', color: 'var(--text-muted)', marginBottom: '16px'}}>Quyida tashqi formada foydalanuvchilarga qanday savollar berilishini o'zingiz belgilang. Maydonlarni qo'shish, o'chirish va tartibini o'zgartirish mumkin.</p>
                             
                             <div style={{display:'flex', flexDirection:'column', gap:'8px', marginBottom:'24px'}}>
                                {formFields.map((f, idx) => (
                                   <div key={f.id} style={{display:'flex', gap:'8px', alignItems:'center', padding:'12px', background:'var(--bg-base)', border:'1px solid var(--border-light)', borderRadius:'6px'}}>
                                      <span style={{color:'var(--text-muted)', fontSize:'12px', width:'24px'}}>{idx+1}.</span>
                                      <input className="input-base" style={{marginBottom:0, flex:2}} placeholder="Savol nomi (label)" value={f.label} onChange={e => setFormFields(formFields.map(x => x.id === f.id ? {...x, label: e.target.value} : x))} />
                                      <input className="input-base" style={{marginBottom:0, flex:1}} placeholder="Kalit (key)" value={f.key} onChange={e => setFormFields(formFields.map(x => x.id === f.id ? {...x, key: e.target.value} : x))} />
                                      <select className="input-base" style={{marginBottom:0, width:'100px'}} value={f.type} onChange={e => setFormFields(formFields.map(x => x.id === f.id ? {...x, type: e.target.value} : x))}>
                                         <option value="text">Matn</option>
                                         <option value="tel">Telefon</option>
                                         <option value="email">Email</option>
                                         <option value="number">Raqam</option>
                                      </select>
                                      <label style={{fontSize:'11px', color:'var(--text-muted)', display:'flex', alignItems:'center', gap:'4px', cursor:'pointer'}}>
                                         <input type="checkbox" checked={f.required} onChange={e => setFormFields(formFields.map(x => x.id === f.id ? {...x, required: e.target.checked} : x))} /> Majburiy
                                      </label>
                                      <button className="btn-danger" style={{padding:'4px 8px'}} onClick={() => setFormFields(formFields.filter(x => x.id !== f.id))}>&times;</button>
                                   </div>
                                ))}
                                <button className="btn-outline" onClick={() => setFormFields([...formFields, { id: 'f_' + Date.now(), label: '', key: 'custom_' + Date.now(), type: 'text', required: false, placeholder: '' }])}>+ Yangi savol (maydon) qo'shish</button>
                             </div>

                             <div style={{borderTop:'1px solid var(--border-light)', paddingTop:'24px'}}>
                                <div style={{display:'flex', alignItems:'center', gap:'10px', marginBottom:'16px'}}>
                                   <div style={{width:'36px', height:'36px', background:'linear-gradient(135deg, var(--accent), #8b5cf6)', borderRadius:'10px', display:'flex', alignItems:'center', justifyContent:'center', color:'#fff'}}><Ico n="link" s={18} c={{stroke:'#fff'}}/></div>
                                   <div>
                                      <div style={{fontWeight:600, fontSize:'14px', color:'var(--text-main)'}}>Havola Yaratish</div>
                                      <div style={{fontSize:'11px', color:'var(--text-muted)'}}>Tashqi formaning URL havolasini oling</div>
                                   </div>
                                </div>
                                
                                <div style={{display:'flex', gap:'12px', alignItems:'stretch'}}>
                                   <select id="formPipeSelect" className="input-base" style={{marginBottom:0, flex:1}} defaultValue="">
                                      <option value="" disabled>Quvurni tanlang...</option>
                                      {pipelines.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                   </select>
                                   <button className="btn-primary" style={{whiteSpace:'nowrap', display:'flex', alignItems:'center', gap:'6px'}} onClick={() => {
                                      const sel = document.getElementById('formPipeSelect');
                                      if(!sel.value) return alert('Avval quvurni tanlang!');
                                      const lnk = window.location.origin + window.location.pathname + '?leadForm=true&pipe=' + sel.value;
                                      navigator.clipboard.writeText(lnk).then(() => {
                                         sel.nextElementSibling?.nextElementSibling?.remove();
                                         const linkBox = document.getElementById('generatedLinkBox');
                                         if(linkBox) { linkBox.value = lnk; linkBox.parentElement.style.display = 'flex'; }
                                      });
                                   }}><Ico n="link" s={13}/> Havolani Nusxalash</button>
                                </div>
                                
                                <div id="generatedLinkWrap" style={{display:'none', marginTop:'12px', gap:'8px', alignItems:'center'}}>
                                   <input id="generatedLinkBox" className="input-base" readOnly style={{marginBottom:0, flex:1, fontSize:'12px', fontFamily:'monospace', background:'var(--bg-base)', color:'var(--success)'}} />
                                   <span style={{fontSize:'11px', color:'var(--success)', fontWeight:600, whiteSpace:'nowrap'}}><Ico n="check" s={13}/> Nusxalandi!</span>
                                </div>
                             </div>
                             
                             <div style={{marginTop: '24px', padding: '20px', borderRadius: '12px', background: 'linear-gradient(135deg, rgba(59,130,246,0.08), rgba(139,92,246,0.08))', border: '1px solid rgba(59,130,246,0.2)'}}>
                               <div style={{display:'flex', gap:'10px', alignItems:'flex-start'}}>
                                  <span style={{fontSize:'24px'}}><Ico n="bulb" s={24}/></span>
                                  <div>
                                     <strong style={{display:'block', marginBottom:'6px', color:'var(--text-main)'}}>Maslahat</strong>
                                     <div style={{fontSize: '13px', color:'var(--text-secondary)', lineHeight:'1.6'}}>Yuqoridagi savollarni o'zgartirsangiz, havola o'zgarmaydi — formadagi savollar <b>avtomatik yangilanadi</b>. Bu havolani <b>Instagram BIO</b>, <b>Telegram kanal</b> yoki <b>Facebook sahifangizga</b> qo'yishingiz mumkin.</div>
                                  </div>
                               </div>
                             </div>
                          </div>
                       )}
                    </div>
                 </div>
               )}
               

            </div>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
